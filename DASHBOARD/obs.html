<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script src="shared.js?v=3" data-no-esc></script>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBS Productivity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e14;--bg-elev:#11151c;--bg-panel:#151a23;--bg-hover:#1a2030;
  --border:#1e2531;--border-strong:#2a3340;
  --text:#e6e9ef;--text-muted:#8a93a3;--text-dim:#5b6373;--text-faint:#3e4452;
  --accent:#4f8cff;--accent-soft:rgba(79,140,255,0.13);--accent-text:#93b6ff;
  --good:#22c55e;--bad:#f87171;--warn:#f59e0b;
  --font:"Inter",-apple-system,sans-serif;--mono:"JetBrains Mono",monospace;
}
[data-theme="light"]{
  --bg:#f5f6f8;--bg-elev:#fff;--bg-panel:#fff;--bg-hover:#f0f3f7;
  --border:#e5e8ed;--border-strong:#d1d6de;
  --text:#1a1f29;--text-muted:#5b6373;--text-dim:#8a93a3;--text-faint:#b4bac5;
  --accent:#2563eb;--accent-soft:rgba(37,99,235,0.08);--accent-text:#1d4ed8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);font-size:13px;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
.topbar{height:52px;background:var(--bg-elev);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
body.in-shell .topbar{display:none!important}
.tb-logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#7aa9ff);display:grid;place-items:center;color:#fff;font-weight:700}
.page-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.toolbar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--bg-elev);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tb-label{font-size:11px;color:var(--text-muted);font-weight:600}
.sel,.inp{padding:6px 9px;border:1px solid var(--border-strong);border-radius:6px;background:var(--bg-panel);color:var(--text);font-size:12px;outline:none}
.sel:focus,.inp:focus{border-color:var(--accent)}
.inp{width:84px;font-family:var(--mono)}
.btn{padding:6px 12px;border:1px solid var(--border-strong);border-radius:6px;background:var(--bg-panel);font-size:12px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--bg-hover)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.tb-spacer{flex:1}
.scroll{flex:1;overflow-y:auto;padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kpi .v{font-size:22px;font-weight:800;font-family:var(--mono);letter-spacing:-.5px}
.kpi .l{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:3px;font-weight:600}
.kpi .s{font-size:10px;color:var(--text-faint);margin-top:2px}
.kpi.ok .v{color:var(--good)} .kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.accent .v{color:var(--accent-text)}
.disc-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:18px 2px 8px;border-bottom:1px solid var(--border);padding-bottom:6px}
.panel{background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.panel-h{padding:10px 14px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.panel.collapsed .panel-h{border-bottom:0}
.panel:not(.collapsed) .panel-h{border-bottom:1px solid var(--border)}
.caret{display:inline-block;transition:transform .15s;color:var(--text-faint);font-size:10px}
.panel.collapsed .caret{transform:rotate(-90deg)}
.panel.collapsed .panel-b{display:none}
.gname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:20px}
.tag.ok{background:rgba(34,197,94,.14);color:var(--good)}
.tag.off{background:rgba(245,158,11,.14);color:var(--warn)}
.mini{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);white-space:nowrap}
.mini b{color:var(--text)}
.mini.cpi b.ok{color:var(--good)} .mini.cpi b.bad{color:var(--bad)}
.panel-b{padding:10px 14px}
.pool-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--border)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10px;color:var(--text-muted);font-weight:600}
.msg{font-size:11px;margin-left:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:right;padding:6px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:700;border-bottom:1px solid var(--border)}
th.l,td.l{text-align:left}
td{padding:5px 10px;text-align:right;border-bottom:1px solid var(--border);font-family:var(--mono)}
tbody tr:last-child td{border-bottom:0}
.code{color:var(--accent-text);font-weight:700}
.muted{color:var(--text-faint)}
.totrow td{font-weight:800;background:var(--bg-panel)}
#access-denied{display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;height:100vh;background:var(--bg);color:var(--text)}
#access-denied.show{display:flex}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,14,20,.7);z-index:50}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="topbar"><div class="tb-logo">M</div><div><div style="font-weight:600">OBS Productivity</div><div style="font-size:10px;color:var(--text-dim)">RA labour earned-value — by group, by month, by day</div></div></div>

<div id="access-denied"><div style="font-size:46px">🔒</div><div style="font-size:20px;font-weight:700;color:var(--bad)">Access Denied</div><div style="color:var(--text-muted)">OBS data requires the <b>view_obs</b> permission.</div></div>

<div class="page-wrap" id="page">
  <div class="toolbar">
    <button class="btn" id="view-groups" onclick="setView('groups')">By Group</button>
    <button class="btn" id="view-summary" onclick="setView('summary')">Summary</button>
    <button class="btn" id="view-day" onclick="setView('day')">By Day</button>
    <span style="width:1px;height:22px;background:var(--border);margin:0 4px"></span>
    <span class="tb-label month-ctl">Month</span>
    <input type="month" id="f-month" class="sel month-ctl" onchange="reload()">
    <select id="f-mode" class="sel month-ctl" onchange="setMode(this.value)" title="Show this month alone, or everything up to and including it">
      <option value="month">This month</option>
      <option value="cum">Cumulative to date</option>
    </select>
    <span class="tb-label day-ctl" style="display:none">Date</span>
    <input type="date" id="f-day" class="sel day-ctl" style="display:none" onchange="reload()">
    <button class="btn day-ctl" style="display:none" onclick="dayShift(-1)" title="Previous day">◀</button>
    <button class="btn day-ctl" style="display:none" onclick="dayToday()">Today</button>
    <button class="btn day-ctl" style="display:none" onclick="dayShift(1)" title="Next day">▶</button>
    <button class="btn" onclick="hardRefresh()">↻ Refresh</button>
    <button class="btn" id="btn-expand" onclick="toggleAll(true)">Expand all</button>
    <button class="btn" id="btn-collapse" onclick="toggleAll(false)">Collapse all</button>
    <button class="btn" id="btn-print" onclick="printSummary()" style="display:none">🖨 Print</button>
    <div class="tb-spacer"></div>
    <span class="tb-label" id="tb-info" style="color:var(--text-faint)"></span>
  </div>

  <div class="scroll" style="position:relative">
    <div class="loading" id="loading"><div class="spin"></div></div>
    <div class="kpis" id="kpis"></div>
    <div id="groups"></div>
    <div id="summary" style="display:none"></div>
    <div id="dayview" style="display:none"></div>
  </div>
</div>

<script>
'use strict';
const AED_RATE = 10.5;
const RA_PREFIX = 'RA';
const IN_PROGRESS_CREDIT = 0.5;

let perms=[], canEnter=false, isSuper=false;
let view='groups';       // 'groups' (per-group) | 'summary' (EVM by discipline) | 'day'
// Month alone, or everything up to and including it. Applies to both the group and
// summary views; By Day is a single date and ignores it.
let cumulative=false;
let groups=[];           // [{discipline,disc_sort,group,subs:[...],status,configured,EV,AC,BAC}]
let codeToActId={}, actIdToCode={};       // WIR code <-> activities.id
let clrCodeToId={}, clrIdToCode={};        // clearance code <-> clearance_activities.id
let indirectHrs=0;       // cumulative/monthly indirect-trade man-hours (overhead)
// Excel OBS Summary category labels per discipline
const DISC_LABEL={'DRAINAGE ACTIVITIES':'All Drainage Works','WATER SUPPLY ACTIVITIES':'All Water Supply Works','HVAC ACTIVITIES':'All HVAC Works','ELECTRICAL ACTIVITIES':'All Electrical Works','Functional Test':'Functional Test','Snagging and de-snagging':'Snag / De-snag','Internal Rectification':'Rectifications (Direct Works)','PRECAST':'Pre-cast','Subcontractor Works Done by RA Labor':'Sub Contractor Work by RA'};
let compByCode={};       // wirCode -> {applicable:Set, done:Set, inprog:Set} for the month

function applyTheme(t){ document.documentElement.setAttribute('data-theme', t||'dark'); }
function fmt(n,d){ n=Number(n)||0; return n.toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function fmtK(n){ n=Math.round(Number(n)||0); if(Math.abs(n)>=1e6)return (n/1e6).toFixed(2)+'M'; if(Math.abs(n)>=1000)return (n/1000).toFixed(1)+'K'; return n.toLocaleString(); }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function monthStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthEnd(m){ const [y,mo]=m.split('-').map(Number); return (mo===12?(y+1)+'-01-01':y+'-'+String(mo+1).padStart(2,'0')+'-01'); }

function getH(extra){
  let t=window.__MEP_TOKEN__;
  if(!t){try{const s=localStorage.getItem('mep_session');if(s){const j=JSON.parse(s);if(j&&j.access_token&&j.expires_at&&Date.now()<j.expires_at-30000)t=j.access_token;}}catch(e){}}
  return Object.assign({'apikey':KEY,'Authorization':'Bearer '+(t||KEY),'Content-Type':'application/json'},extra||{});
}
async function fa(path){ const r=await fetch(SB+'/rest/v1/'+path,{headers:getH()}); if(!r.ok)throw new Error('['+r.status+'] '+await r.text()); return r.json(); }
// Paginated fetch — pages past PostgREST's 1000-row cap via Range headers.
async function faAll(path){
  let out=[], from=0; const page=1000;
  for(;;){
    const r=await fetch(SB+'/rest/v1/'+path,{headers:getH({'Range-Unit':'items','Range':from+'-'+(from+page-1)})});
    if(!r.ok)throw new Error('['+r.status+'] '+await r.text());
    const d=await r.json(); out=out.concat(d);
    if(!Array.isArray(d)||d.length<page)break;
    from+=page;
  }
  return out;
}
async function fwrite(method,path,body){ const r=await fetch(SB+'/rest/v1/'+path,{method,headers:getH({'Prefer':'return=representation,resolution=merge-duplicates'}),body:JSON.stringify(body)}); if(!r.ok)throw new Error('['+r.status+'] '+await r.text()); return r.json(); }

async function init(){
  perms=(window.__MEP_USER__&&window.__MEP_USER__.permissions)||[];
  const sa=perms.includes('manage_users')&&perms.includes('manage_system');
  const canView=sa||perms.includes('view_obs')||perms.includes('obs_entry')||perms.includes('edit_obs');
  canEnter=sa||perms.includes('obs_entry')||perms.includes('edit_obs');
  isSuper=sa;   // manual villas-done overrides are super-admin only (RLS enforces it too)
  if(!canView){ document.getElementById('page').style.display='none'; document.getElementById('access-denied').classList.add('show'); return; }
  document.getElementById('f-month').value=monthStr(new Date());
  await loadCatalogue();
  setView('groups');   // sets toggle state + triggers initial load
}

// Load every activity grouped by discipline → group (once).
async function loadCatalogue(){
  const rows=await fa('obs_activities?select=ccs_code,description,unit,std_prod_rate,qty_per_villa,completion_wir_code,completion_type,discipline,discipline_sort,activity_group&is_active=eq.true&order=discipline_sort.asc,activity_group.asc,ccs_code.asc');
  const map={}, order=[];
  rows.forEach(a=>{
    const g=a.activity_group||'(none)';
    if(!map[g]){ map[g]={ discipline:a.discipline||'Other', disc_sort:a.discipline_sort??99, group:g, subs:[] }; order.push(g); }
    const G=Number(a.std_prod_rate)||0, W=Number(a.qty_per_villa)||0;
    map[g].subs.push({ ccs_code:a.ccs_code, description:a.description, unit:a.unit||'', G, W, AC:W*G, wir:String(a.completion_wir_code||''), ctype:a.completion_type||'wir' });
  });
  groups=order.map(g=>map[g]);
  groups.forEach(grp=>{
    const hasWir=grp.subs.some(s=>s.wir), hasQty=grp.subs.some(s=>s.W>0);
    grp.status = (hasWir&&hasQty) ? 'ok' : (hasWir ? 'noqty' : 'nowir');
    grp.configured = grp.status==='ok';
  });
  // resolve completion codes -> ids, split by type (WIR → activities, clearance → clearance_activities)
  const wirSet=new Set(), clrSet=new Set();
  groups.forEach(g=>g.subs.forEach(s=>{ if(!s.wir)return; (s.ctype==='clearance'?clrSet:wirSet).add(s.wir); }));
  codeToActId={}; actIdToCode={}; clrCodeToId={}; clrIdToCode={};
  if(wirSet.size){
    const a=await fa('activities?select=id,activity_code&activity_code=in.('+[...wirSet].join(',')+')');
    a.forEach(r=>{ codeToActId[r.activity_code]=r.id; actIdToCode[r.id]=r.activity_code; });
  }
  if(clrSet.size){
    const c=await fa('clearance_activities?select=id,clearance_code&clearance_code=in.('+[...clrSet].map(x=>'"'+String(x).replace(/"/g,'')+'"').join(',')+')');
    c.forEach(r=>{ clrCodeToId[r.clearance_code]=r.id; clrIdToCode[r.id]=r.clearance_code; });
  }
}

async function reload(){
  const loading=document.getElementById('loading'); loading.style.display='flex';
  try{
    if(view==='day'){ await renderDay(); return; }   // day view reads manpower only, not completion
    const m=document.getElementById('f-month').value||monthStr(new Date());
    const cum=cumulative;
    await Promise.all([ loadCompletion(m,cum), loadLabour(m,cum), loadAlloc(m,cum), loadManual(m,cum) ]);
    if(view==='summary') renderSummary(m); else render(m);
  }catch(e){ document.getElementById('tb-info').textContent='Error: '+e.message; console.error(e); }
  finally{ loading.style.display='none'; }
}

/* The three completion queries carry no date filter — the period is applied below, in JS.
   So the same rows come back for every month. Cache them once: switching months stops
   refetching tens of thousands of rows, and the 13-month backfill pass becomes one fetch
   instead of thirteen. Cleared by ↻ Refresh and after an allocation write. */
let compRaw=null;
function clearCompCache(){ compRaw=null; }
async function fetchCompletionRaw(){
  if(compRaw) return compRaw;
  const ids=Object.keys(codeToActId).map(c=>codeToActId[c]).filter(Boolean);
  const clrIds=Object.keys(clrCodeToId).map(c=>clrCodeToId[c]).filter(Boolean);
  const [wir,prog,clr]=await Promise.all([
    ids.length ? faAll('dc_import_log?select=villa_id,activity_id,normalised_status,submitted_date,response_date,raw_subcontractor'
      +'&activity_id=in.('+ids.join(',')+')&raw_subcontractor=ilike.'+RA_PREFIX+'*&normalised_status=in.(approved,under_review)') : [],
    ids.length ? faAll('progress_updates?select=villa_id,activity_id,status,finish_date,subcontractor'
      +'&activity_id=in.('+ids.join(',')+')&is_current=eq.true&is_deleted=eq.false&subcontractor=ilike.'+RA_PREFIX+'*') : [],
    clrIds.length ? faAll('clearance_import_log?select=villa_id,clearance_activity_id,normalised_status,clearance_received_date,clearance_released_date'
      +'&clearance_activity_id=in.('+clrIds.join(',')+')') : []
  ]);
  compRaw={ids,clrIds,wir,prog,clr};
  return compRaw;
}

// Physical completion for ALL configured codes, RA-scope, within the month. (Same model as before.)
async function loadCompletion(m,cum){
  const end=monthEnd(m), start=m+'-01';
  // Date-required test (used for WIR-derived completions — the approval date places them):
  //   monthly = date inside the month · cumulative = any date up to month end.
  const inM=d=> cum ? (!!d && d<end) : (!!d && d>=start && d<end);
  // Site-progress test. A 'completed' row is done even if undated, so in CUMULATIVE
  // undated counts as done-to-date; in MONTHLY it needs a date in the month (no dumping
  // every undated completion into the current month).
  const countIt=d=> cum ? (!d || d<end) : (!!d && d>=start && d<end);
  const wirCodeArr=Object.keys(codeToActId), clrCodeArr=Object.keys(clrCodeToId);
  const ids=wirCodeArr.map(c=>codeToActId[c]).filter(Boolean);
  const clrIds=clrCodeArr.map(c=>clrCodeToId[c]).filter(Boolean);
  compByCode={}; [...wirCodeArr,...clrCodeArr].forEach(c=>compByCode[c]={applicable:new Set(),done:new Set(),inprog:new Set()});
  if(!ids.length && !clrIds.length) return;
  const RAW=await fetchCompletionRaw();

  // ── WIR-based completion (RA-scope via progress_updates + dc_import_log) ──
  if(ids.length){
  const wirRA=RAW.wir;
  const raWir={};
  wirRA.forEach(w=>{ const k=w.villa_id+'_'+w.activity_id; const e=raWir[k]||(raWir[k]={appr:null,ur:null});
    if(w.normalised_status==='approved'){ const d=w.response_date||w.submitted_date; if(d&&(!e.appr||d>e.appr))e.appr=d; }
    else if(w.normalised_status==='under_review'){ const d=w.submitted_date||w.response_date; if(d&&(!e.ur||d>e.ur))e.ur=d; } });

  const rows=RAW.prog;

  // Completion date = progress finish_date, else the RA WIR's approved/UR date (raWir, already fetched & bounded).
  rows.forEach(r=>{ const code=actIdToCode[r.activity_id]; if(!code)return; const vid=r.villa_id;
    compByCode[code].applicable.add(vid);
    const wd=raWir[vid+'_'+r.activity_id]||{}; const effDate=r.finish_date||wd.appr||wd.ur||null;
    if(r.status==='completed'){ if(countIt(effDate)) compByCode[code].done.add(vid); }
    else if(r.status==='in_progress'){ if(countIt(effDate)) compByCode[code].inprog.add(vid); } });

  Object.keys(raWir).forEach(k=>{ const us=k.lastIndexOf('_'); const vid=+k.slice(0,us); const aid=+k.slice(us+1);
    const code=actIdToCode[aid]; if(!code)return; const f=raWir[k];
    compByCode[code].applicable.add(vid);
    if(compByCode[code].done.has(vid)||compByCode[code].inprog.has(vid))return;
    if(inM(f.appr)) compByCode[code].done.add(vid); else if(inM(f.ur)) compByCode[code].inprog.add(vid); });
  } // end WIR block

  // ── Clearance-based completion (clearance_import_log has no subcontractor, so it is NOT RA-filtered) ──
  if(clrIds.length){
    const cl=RAW.clr;
    cl.forEach(r=>{ const code=clrIdToCode[r.clearance_activity_id]; if(!code)return; const vid=r.villa_id;
      compByCode[code].applicable.add(vid);
      const d=r.clearance_released_date||r.clearance_received_date||null;
      if(r.normalised_status==='fully_approved'){ if(countIt(d)){ compByCode[code].done.add(vid); compByCode[code].inprog.delete(vid); } }
      else if(r.normalised_status==='pending'){ if(countIt(d) && !compByCode[code].done.has(vid)) compByCode[code].inprog.add(vid); } });
  }
}

// SPENT comes from OBS Config: trade man-hours (obs_manpower) split across groups (obs_trade_distribution).
let tradeHrs={};      // trade -> man-hours for the selected month
let distByGroup={};   // activity_group -> [{trade,pct}]
let tradeDays={};     // trade -> man-days for the period
async function loadLabour(m,cum){
  const end=monthEnd(m);
  const mpf = cum ? ('period_month=lt.'+end) : ('period_month=eq.'+m+'-01');
  const [mp,dist]=await Promise.all([
    fa('obs_manpower?select=trade,man_days,shift_hours,is_indirect&'+mpf),
    fa('obs_trade_distribution?select=trade,activity_group,pct')
  ]);
  tradeHrs={}; tradeDays={}; indirectHrs=0;
  mp.forEach(r=>{ const days=Number(r.man_days)||0, h=days*(Number(r.shift_hours)||0);
    tradeHrs[r.trade]=(tradeHrs[r.trade]||0)+h; tradeDays[r.trade]=(tradeDays[r.trade]||0)+days; if(r.is_indirect) indirectHrs+=h; });
  distByGroup={}; dist.forEach(d=>{ (distByGroup[d.activity_group]=distByGroup[d.activity_group]||[]).push({trade:d.trade,pct:Number(d.pct)||0}); });
}
// Raw distributed hours: monthly trade man-hours × that group's share.
function groupSpentRaw(grp){ return (distByGroup[grp.group]||[]).reduce((s,d)=>s+(tradeHrs[d.trade]||0)*d.pct/100,0); }

// Actual hours are capped at what the completed work earned (EV). The distribution is a
// planning split, so it can push more hours into a category than that category earned;
// left alone it overstates spend there and hides it from wherever the labour really went.
// The surplus is held back as an unassigned pool and placed by hand (obs_hour_allocation).
// Nothing is discarded — the pool is reported so project totals still reconcile with payroll.
let manualAlloc={};        // activity_group -> manually assigned hours
let unassignedPool=0;      // capped-off hours not yet placed
function groupSpent(grp){
  const raw=groupSpentRaw(grp);
  const cap=(grp.EV||0);
  const capped=cap>0 ? Math.min(raw,cap) : raw;   // no earned value yet → nothing to cap against
  // Hours booked directly to the group are a measurement, not a distribution estimate,
  // so they are added after the cap — capping them would quietly hide real labour.
  return capped + (Number(manualAlloc[grp.group])||0) + (Number(groupLabour[grp.group])||0);
}
// Cumulative reads every month up to and including m, so values are summed rather than
// assigned — assigning would silently keep whichever month came back last.
function monthFilter(m,cum){ return cum ? 'period_month=lt.'+monthEnd(m) : 'period_month=eq.'+m+'-01'; }

async function loadAlloc(m,cum){
  manualAlloc={};
  try{
    const rows=await fa('obs_hour_allocation?select=activity_group,hours&'+monthFilter(m,cum));
    rows.forEach(r=>{ manualAlloc[r.activity_group]=(manualAlloc[r.activity_group]||0)+(Number(r.hours)||0); });
  }catch(e){ manualAlloc={}; }
}

/* ───── MANUAL OVERRIDES ─────
   Some work the automated derivation cannot see. PRECAST is the case that forced this:
   PRE2/PRE3 carry no completion code and the group has no trade distribution, so it
   reads as zero on both sides. Villas done can be entered per code, and labour can be
   booked straight to a group — both per month, both super-admin only. */
let manualDone={};     // ccs_code -> villas done, entered by hand (overrides the derived count)
let groupLabour={};    // activity_group -> man-hours booked directly to the group
async function loadManual(m,cum){
  manualDone={}; groupLabour={};
  try{
    const flt=monthFilter(m,cum);
    const [d,l]=await Promise.all([
      fa('obs_manual_completion?select=ccs_code,villas_done&'+flt),
      fa('obs_group_labour?select=activity_group,man_hours&'+flt)
    ]);
    // Each month records what was done in that month, so cumulative is their sum.
    (d||[]).forEach(r=>{ manualDone[r.ccs_code]=(manualDone[r.ccs_code]||0)+(Number(r.villas_done)||0); });
    (l||[]).forEach(r=>{ groupLabour[r.activity_group]=(groupLabour[r.activity_group]||0)+(Number(r.man_hours)||0); });
  }catch(e){ manualDone={}; groupLabour={}; }
}

// One place decides a sub-activity's numbers, so the group view and the summary can
// never disagree about what was done.
function subStats(s){
  const c=compByCode[s.wir]||{applicable:new Set(),done:new Set(),inprog:new Set()};
  const man=manualDone[s.ccs_code];
  const manual=(man!=null);
  const done   = manual ? man : c.done.size;
  const inprog = manual ? 0   : c.inprog.size;   // a hand-entered count is final, not partial
  // Budget needs a villa population. A manually-entered code has no derived applicable
  // set, so fall back to what was entered — otherwise BAC is 0 and CPI/EAC blow up.
  const Z=Math.max(c.applicable.size, manual?done:0);
  return { done, inprog, Z, manual, EV:(done+inprog*IN_PROGRESS_CREDIT)*s.AC, BAC:Z*s.AC };
}
// Man-days of labour distributed to a group this period (how many workers' days are assigned to it).
function groupDays(grp){ return (distByGroup[grp.group]||[]).reduce((s,d)=>s+(tradeDays[d.trade]||0)*d.pct/100,0); }

/* Fills grp.EV/BAC/ACraw/AC/capped plus the unassigned pool. Shared by both views:
   groupSpent() caps against grp.EV, and before this was shared the Summary read whatever
   grp.EV the group view happened to leave behind — so its cap and the unassigned pool
   depended on which view you opened first. */
function computeGroups(){
  groups.forEach(grp=>{
    let EV=0, BAC=0;
    grp.subs.forEach(s=>{ const st=subStats(s);
      s.done=st.done; s.inprog=st.inprog; s.Z=st.Z; s.manual=st.manual; s.EV=st.EV;
      EV+=st.EV; BAC+=st.BAC; });
    grp.EV=EV; grp.BAC=BAC;
    grp.ACraw=groupSpentRaw(grp);
    grp.AC=groupSpent(grp);                       // reads grp.EV — set just above
    grp.capped=Math.max(0, grp.ACraw-(grp.EV>0?Math.min(grp.ACraw,grp.EV):grp.ACraw));
  });
  // hours the cap held back, less whatever has already been placed by hand
  const heldBack=groups.reduce((s,g)=>s+(g.capped||0),0);
  const placed=Object.values(manualAlloc).reduce((s,v)=>s+(Number(v)||0),0);
  unassignedPool=Math.max(0, heldBack-placed);
}

function render(m){
  computeGroups();
  let totEV=0, totAC=0; const totVillas=new Set();
  groups.forEach(grp=>{
    totEV+=grp.EV; totAC+=grp.AC;
    // Manual counts are a number, not a villa list, so they add nothing to the villa tally.
    grp.subs.forEach(s=>{ if(s.manual) return;
      const c=compByCode[s.wir]; if(!c) return;
      c.done.forEach(v=>totVillas.add(v)); c.inprog.forEach(v=>totVillas.add(v)); });
  });
  const cpi=totAC?totEV/totAC:0; const variance=totEV-totAC;
  document.getElementById('tb-info').textContent=periodTag(m)+' · '+groups.length+' groups · '+groups.filter(g=>g.configured).length+' configured';

  const kpi=(v,l,s,cls)=>`<div class="kpi ${cls||''}"><div class="v">${v}</div><div class="l">${l}</div><div class="s">${s||''}</div></div>`;
  document.getElementById('kpis').innerHTML=
    kpi(fmt(totVillas.size),'Villas Active','across all groups '+(cumulative?'to date':'this month'),'accent')
   +kpi(fmtK(totEV),'Earned Hrs (EV)','output delivered '+periodOf(m))
   +kpi(fmtK(totAC),'Spent Hrs (AC)','RA labour '+periodOf(m))
   +kpi((variance>=0?'+':'')+fmtK(variance),variance>=0?'Hrs Saved':'Hrs Over','earned − spent',variance>=0?'ok':'bad')
   +kpi((cpi?cpi.toFixed(2):'—'),'CPI','earned ÷ spent',(cpi>=1?'ok':cpi>0?'warn':''))
   +kpi('AED '+fmtK(variance*AED_RATE),'Cost Variance','@ '+AED_RATE+' AED/hr',variance>=0?'ok':'bad');

  let html=''; let lastDisc=null;
  groups.forEach((grp,gi)=>{
    if(grp.discipline!==lastDisc){ lastDisc=grp.discipline; html+=`<div class="disc-h">${esc(grp.discipline)}</div>`; }
    const cpiG=grp.AC?grp.EV/grp.AC:0;
    // A group fed by hand (PRECAST) is tracked, even though it has no completion WIR —
    // don't nag for configuration it will never need.
    const byHand = grp.subs.some(s=>s.manual) || (Number(groupLabour[grp.group])||0)>0;
    const collapsed = (grp.status==='ok'||byHand) ? '' : 'collapsed';
    const tag = byHand ? '<span class="tag ok">manual entry</span>'
      : grp.status==='ok' ? '<span class="tag ok">configured</span>'
      : grp.status==='noqty' ? '<span class="tag off">needs qty/villa</span>'
      : '<span class="tag off">needs completion WIR</span>';
    const hint = (grp.status==='ok'||byHand) ? ''
      : grp.status==='noqty' ? '<div class="muted" style="font-size:11px;margin-bottom:8px">WIR is set — add <b>Qty/villa</b> for each sub-activity in <b>OBS Config → Activities &amp; WIR</b> to compute budget &amp; earned.</div>'
      : '<div class="muted" style="font-size:11px;margin-bottom:8px">Set the <b>completion WIR</b> for these sub-activities in <b>OBS Config → Activities &amp; WIR</b> to enable earned-value tracking.</div>';
    const direct=Number(groupLabour[grp.group])||0;
    const spentNote = direct ? ' — includes '+fmt(direct,0)+' hrs booked directly to this group'
                    : grp.AC ? '' : ' (no manpower/distribution for this group)';
    html+=`<div class="panel ${collapsed}" id="gp-${gi}">`
      +`<div class="panel-h" onclick="toggle(${gi})">`
        +`<span class="caret">▾</span>`
        +`<span class="gname" title="${esc(grp.group)}">${esc(grp.group)}</span>`
        +tag
        +`<span class="mini" title="man-days of labour assigned to this group ${cumulative?'up to and including this month':'this month'}">Labour <b>${fmt(groupDays(grp),0)}</b>md</span>`
        +`<span class="mini">EV <b>${fmtK(grp.EV)}</b></span>`
        +`<span class="mini" title="from manpower × distribution${spentNote}">AC <b>${fmtK(grp.AC)}</b></span>`
        +`<span class="mini cpi">CPI <b class="${cpiG>=1?'ok':cpiG>0?'bad':''}">${cpiG?cpiG.toFixed(2):'—'}</b></span>`
        +(isSuper?`<button class="btn" style="padding:2px 8px;font-size:11px" title="Edit villas done for this group"
             onclick="event.stopPropagation();openDone(${gi})">✎ Villas done</button>`:'')
      +`</div>`
      +`<div class="panel-b">${hint}${subTable(grp)}</div></div>`;
  });
  document.getElementById('groups').innerHTML=html;
}

function subTable(grp){
  let h='<table><thead><tr><th class="l">Code</th><th class="l">Sub-Activity</th><th>WIR</th><th>Std Hr/Unit</th><th>Qty/Villa</th><th>Budget Hr/Villa</th><th>Villas Done</th><th>Earned (EV)</th></tr></thead><tbody>';
  let budgetPerVilla=0;
  grp.subs.forEach(s=>{ budgetPerVilla+=s.AC;
    h+=`<tr><td class="l code">${esc(s.ccs_code)}</td><td class="l" style="font-family:var(--font)">${esc(s.description)}</td>`
      +`<td><span class="code">${s.wir||'—'}</span></td><td>${fmt(s.G,2)}</td><td>${fmt(s.W,2)}</td><td>${fmt(s.AC,2)}</td>`
      +`<td>${s.done||0}${s.inprog?'<span class="muted"> +'+s.inprog+'ip</span>':''}`
      +`${s.manual?'<span class="tag off" style="margin-left:6px" title="Entered by hand — overrides the derived count">manual</span>':''}</td>`
      +`<td>${fmt(s.EV||0,0)}</td></tr>`; });
  h+=`<tr class="totrow"><td class="l" colspan="5">TOTAL</td><td>${fmt(budgetPerVilla,1)}</td><td>—</td><td>${fmt(grp.EV||0,0)}</td></tr>`;
  return h+'</tbody></table>';
}

/* ───── MANUAL VILLAS DONE (super admin) ─────
   Overrides the WIR/clearance-derived count for a code in the selected month. Blank means
   "derive it" — that is how you undo an override, rather than typing the derived number
   back in and freezing it. */
function openDone(gi){
  if(!isSuper){ alert('Editing villas done is restricted to super admins.'); return; }
  // In cumulative mode the figures on screen are totals across many months, but a save
  // writes into the selected month alone — that would book the whole running total into
  // one month. Editing stays a per-month action.
  if(cumulative){ alert('Switch the period to “This month” to edit villas done.\n\nCumulative figures are a total across months; edits are saved against a single month.'); return; }
  const grp=groups[gi]; if(!grp) return;
  const m=document.getElementById('f-month').value||'';
  const rows=grp.subs.map(s=>{
    const c=compByCode[s.wir]||{done:new Set(),inprog:new Set()};
    const cur=manualDone[s.ccs_code];
    return `<tr>
      <td class="l"><b>${esc(s.ccs_code)}</b></td>
      <td class="l" style="font-family:var(--font)">${esc(s.description)}</td>
      <td style="text-align:right">${fmt(s.AC,1)}</td>
      <td style="text-align:right" class="muted">${c.done.size}${c.inprog.size?' +'+c.inprog.size+'ip':''}</td>
      <td style="text-align:right"><input type="number" step="1" min="0" value="${cur!=null?esc(cur):''}" placeholder="auto"
          data-code="${esc(s.ccs_code)}" data-budget="${s.AC}" oninput="doneTotal()" class="done-in"
          style="width:90px;text-align:right;background:var(--bg-panel);color:inherit;border:1px solid var(--border-strong);border-radius:6px;padding:3px 6px"></td>
    </tr>`;
  }).join('');
  document.body.insertAdjacentHTML('beforeend',
    `<div id="done-ovl" style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:300"
       onclick="if(event.target===this)closeDone()">
      <div style="background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;width:min(820px,94vw);max-height:86vh;display:flex;flex-direction:column">
        <div style="padding:14px 18px;border-bottom:1px solid var(--border)">
          <div style="font-size:14px;font-weight:650">Villas done — ${esc(grp.group)} · ${esc(m)}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.5">
            Enter what was completed <b>in this month</b>. A value here <b>overrides</b> the count derived
            from WIRs and clearances; clear the box to go back to the derived figure. Earned hours =
            villas done × budget hrs/villa.
          </div>
        </div>
        <div style="padding:12px 18px;overflow:auto">
          <table><thead><tr><th class="l">Code</th><th class="l">Sub-Activity</th>
            <th>Budget hr/villa</th><th>Derived</th><th>Villas done</th></tr></thead>
            <tbody>${rows}</tbody></table>
        </div>
        <div style="padding:10px 18px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px">
          <span style="font-size:12px" id="done-sum"></span>
          <span style="flex:1"></span>
          <button class="btn" onclick="closeDone()">Cancel</button>
          <button class="btn btn-primary" onclick="saveDone()">Save</button>
        </div>
      </div></div>`);
  doneTotal();
}
function closeDone(){ document.getElementById('done-ovl')?.remove(); }
function doneTotal(){
  const ins=[...document.querySelectorAll('.done-in')];
  let ev=0, n=0;
  ins.forEach(i=>{ if(i.value!==''){ n++; ev+=(Number(i.value)||0)*(Number(i.dataset.budget)||0); } });
  document.getElementById('done-sum').textContent = n
    ? n+' code'+(n>1?'s':'')+' overridden · '+fmt(ev,0)+' earned hrs'
    : 'No overrides — all codes derived automatically';
}
async function saveDone(){
  const m=document.getElementById('f-month').value; if(!m) return;
  const period=m+'-01';
  const by=(window.__MEP_USER__&&(window.__MEP_USER__.full_name||window.__MEP_USER__.email))||null;
  const ins=[...document.querySelectorAll('.done-in')];
  const codes=ins.map(i=>'"'+i.dataset.code+'"').join(',');
  const keep=ins.filter(i=>i.value!=='').map(i=>({ period_month:period, ccs_code:i.dataset.code,
    villas_done:Number(i.value)||0, updated_at:new Date().toISOString(), updated_by:by }));
  try{
    // clear this group's codes for the month, then write back only the ones with a value
    if(codes) await fwrite('DELETE','obs_manual_completion?period_month=eq.'+period+'&ccs_code=in.('+encodeURIComponent(codes)+')');
    if(keep.length) await fwrite('POST','obs_manual_completion',keep);
    closeDone();
    await loadManual(m);
    render(m);
  }catch(e){
    alert(/\[40[13]\]/.test(e.message) ? 'Editing villas done is restricted to super admins.'
                                       : 'Could not save: '+e.message);
  }
}

function toggle(gi){ document.getElementById('gp-'+gi)?.classList.toggle('collapsed'); }
function toggleAll(open){ groups.forEach((g,gi)=>{ const el=document.getElementById('gp-'+gi); if(el) el.classList.toggle('collapsed', !open); }); }

// Refresh must go back to the database, not re-read the cached completion rows.
function hardRefresh(){ clearCompCache(); dayMonthCache={}; dayDist=null; reload(); }
function setMode(v){ cumulative=(v==='cum'); reload(); }
// Wording that follows the mode, so no figure is ever read as the wrong period.
function periodOf(m){ return cumulative ? 'to end of '+m : 'in '+m; }
function periodTag(m){ return cumulative ? m+' cumulative' : m; }

function setView(v){
  view=v;
  const grp=v==='groups', day=v==='day', sum=v==='summary';
  document.getElementById('view-groups').classList.toggle('btn-primary',grp);
  document.getElementById('view-summary').classList.toggle('btn-primary',sum);
  document.getElementById('view-day').classList.toggle('btn-primary',day);
  document.getElementById('kpis').style.display=grp?'':'none';
  document.getElementById('groups').style.display=grp?'':'none';
  document.getElementById('summary').style.display=sum?'':'none';
  document.getElementById('dayview').style.display=day?'':'none';
  ['btn-expand','btn-collapse'].forEach(id=>document.getElementById(id).style.display=grp?'':'none');
  document.getElementById('btn-print').style.display=sum?'':'none';
  // By Day is driven by a date, every other view by a month — swap the pickers.
  document.querySelectorAll('.month-ctl').forEach(el=>el.style.display=day?'none':'');
  document.querySelectorAll('.day-ctl').forEach(el=>el.style.display=day?'':'none');
  if(day && !document.getElementById('f-day').value) document.getElementById('f-day').value=dubaiToday();
  reload();
}

/* ───── BY DAY — labour on a single date ─────
   Manpower is captured per MONTH (man-days per trade), so one date is the month's
   man-days ÷ days in that month: the daily average, not a timesheet reading. Said
   plainly on the page so the number is never mistaken for an attendance figure.
   Month totals stay exact — this only divides them. */
let dayMonthCache={};   // 'YYYY-MM-01' -> manpower rows
let dayDist=null;       // [{trade,activity_group,pct}]

function dubaiToday(){ return new Date(Date.now()+4*3600*1000).toISOString().slice(0,10); }  // site runs on Dubai time
function daysInMonth(iso){ const [y,m]=iso.split('-').map(Number); return new Date(y,m,0).getDate(); }
function monthKeyOf(dateIso){ return dateIso.slice(0,7)+'-01'; }
function dayToday(){ document.getElementById('f-day').value=dubaiToday(); reload(); }
function dayShift(n){
  const el=document.getElementById('f-day');
  const d=new Date((el.value||dubaiToday())+'T12:00:00');
  d.setDate(d.getDate()+n);
  el.value=d.toISOString().slice(0,10);
  reload();
}

async function renderDay(){
  const host=document.getElementById('dayview');
  const date=document.getElementById('f-day').value||dubaiToday();
  document.getElementById('f-day').value=date;
  const mk=monthKeyOf(date), nDays=daysInMonth(date);
  const monthLabel=new Date(date+'T12:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const dayLabel=new Date(date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  if(dayDist===null){ try{ dayDist=await fa('obs_trade_distribution?select=trade,activity_group,pct'); }catch(e){ dayDist=[]; } }
  if(!dayMonthCache[mk]) dayMonthCache[mk]=await fa('obs_manpower?select=trade,man_days,shift_hours,is_indirect&period_month=eq.'+mk);
  const rows=dayMonthCache[mk]||[];

  if(!rows.length){
    document.getElementById('tb-info').textContent=date+' · no manpower';
    host.innerHTML=`<div class="panel"><div class="panel-h" style="cursor:default">${esc(dayLabel)}</div>`
      +`<div class="panel-b muted" style="font-size:12px">No manpower saved for <b>${esc(monthLabel)}</b>. `
      +`Import that month under <b>OBS Config → Manpower Import</b> — per-date figures are derived from the monthly totals.</div></div>`;
    return;
  }

  // pro-rate the month to one day
  let totDays=0, totHrs=0, indHrs=0;
  const perTrade=rows.map(r=>{
    const md=(Number(r.man_days)||0)/nDays, sh=Number(r.shift_hours)||0, hrs=md*sh;
    totDays+=md; totHrs+=hrs; if(r.is_indirect) indHrs+=hrs;
    return { trade:r.trade, manDays:md, shift:sh, hrs, indirect:!!r.is_indirect };
  }).sort((a,b)=>b.hrs-a.hrs);

  // spread the day's trade hours across activity groups
  const hrsByTrade={}; perTrade.forEach(t=>{ hrsByTrade[t.trade]=t.hrs; });
  const discOfGroup={}; groups.forEach(g=>{ discOfGroup[g.group]=g.discipline; });
  const byGroup={};
  (dayDist||[]).forEach(d=>{
    const h=(hrsByTrade[d.trade]||0)*(Number(d.pct)||0)/100;
    if(!h) return;
    const e=byGroup[d.activity_group]||(byGroup[d.activity_group]={hrs:0,parts:[]});
    e.hrs+=h; e.parts.push(d.trade+' '+fmt(d.pct,0)+'%');
  });
  const gList=Object.entries(byGroup).sort((a,b)=>b[1].hrs-a[1].hrs);
  const gTot=gList.reduce((s,[,v])=>s+v.hrs,0);
  const unmapped=totHrs-indHrs-gTot;   // direct hours no distribution rule places anywhere

  document.getElementById('tb-info').textContent=date+' · '+fmt(totHrs,0)+' man-hrs/day';

  const kpi=(v,l,s,cls)=>`<div class="kpi ${cls||''}"><div class="v">${v}</div><div class="l">${l}</div><div class="s">${s||''}</div></div>`;
  let h=`<div class="kpis">`
    +kpi(fmt(totHrs,0),'Man-Hours / Day',monthLabel+' ÷ '+nDays+' days','accent')
    +kpi(fmt(totDays,0),'Men on Site','daily average headcount')
    +kpi(fmt(totHrs-indHrs,0),'Direct Hrs','productive work')
    +kpi(fmt(indHrs,0),'Indirect Hrs','overhead labour',indHrs?'warn':'')
    +`</div>`;

  h+=`<div class="panel"><div class="panel-h" style="cursor:default">${esc(dayLabel)}`
    +`<span class="mini" style="margin-left:auto">daily average for ${esc(monthLabel)}</span></div>`
    +`<div class="panel-b muted" style="font-size:11px;line-height:1.55">`
    +`Manpower is recorded per <b>month</b> (man-days per trade), so a single date is shown <b>pro-rated</b>: `
    +`the month's man-days ÷ ${nDays} days. Month totals stay exact — read a day as the average for that month, not a timesheet.`
    +`</div></div>`;

  h+=`<div class="panel"><div class="panel-h" style="cursor:default">By Trade</div><div class="panel-b">`
    +`<table><thead><tr><th class="l">Trade</th><th>Men / Day</th><th>Shift Hrs</th><th>Man-Hours / Day</th><th class="l">Type</th></tr></thead><tbody>`
    +perTrade.map(t=>`<tr><td class="l" style="font-family:var(--font)">${esc(t.trade)}</td><td>${fmt(t.manDays,1)}</td>`
      +`<td>${fmt(t.shift,1)}</td><td><b>${fmt(t.hrs,1)}</b></td>`
      +`<td class="l muted" style="font-family:var(--font)">${t.indirect?'Indirect':'Direct'}</td></tr>`).join('')
    +`<tr class="totrow"><td class="l">TOTAL</td><td>${fmt(totDays,1)}</td><td>—</td><td>${fmt(totHrs,1)}</td>`
    +`<td class="l" style="font-family:var(--font);font-weight:600">${fmt(indHrs,1)} indirect</td></tr></tbody></table></div></div>`;

  h+=`<div class="panel"><div class="panel-h" style="cursor:default">By Activity Group`
    +`<span class="mini" style="font-weight:400">trade hours × distribution %</span></div><div class="panel-b">`;
  if(gList.length){
    h+=`<table><thead><tr><th class="l">Activity Group</th><th class="l">Discipline</th><th>Man-Hours / Day</th><th class="l">From</th></tr></thead><tbody>`
      +gList.map(([g,v])=>`<tr><td class="l" style="font-family:var(--font)">${esc(g)}</td>`
        +`<td class="l muted" style="font-family:var(--font);font-size:11px">${esc(discOfGroup[g]||'—')}</td>`
        +`<td><b>${fmt(v.hrs,1)}</b></td>`
        +`<td class="l muted" style="font-family:var(--font);font-size:11px">${esc(v.parts.join(' · '))}</td></tr>`).join('')
      +`<tr class="totrow"><td class="l" colspan="2">TOTAL DISTRIBUTED</td><td>${fmt(gTot,1)}</td>`
      +`<td class="l" style="font-family:var(--font);font-weight:600;font-size:11px">${ Math.abs(unmapped)>0.05
          ? fmt(unmapped,1)+' hrs/day not covered by any distribution rule' : 'all direct hours distributed'}</td></tr></tbody></table>`;
  }else{
    h+=`<div class="muted" style="font-size:12px">No trade distribution configured — set it under <b>OBS Config → Trade Distribution</b>.</div>`;
  }
  h+=`</div></div>`;
  host.innerHTML=h;
}

// ── Per-month OBS Summary (EVM roll-up by discipline) ──
function evm(x){ const cpi=x.AC?x.EV/x.AC:0; const eac=cpi?x.BAC/cpi:x.BAC; const etc=Math.max(0,eac-x.AC);
  return { AC:x.AC, EV:x.EV, BAC:x.BAC, cv:x.EV-x.AC, cpi, eac, etc, bv:x.BAC-eac, aed:(x.BAC-eac)*AED_RATE }; }
function vCell(n){ const v=Math.round(n); const neg=v<0; return `<td style="font-family:var(--mono);text-align:right;color:${neg?'var(--bad)':'var(--good)'}">${neg?'('+fmt(Math.abs(v))+')':fmt(v)}</td>`; }
function nCell(n){ return `<td style="font-family:var(--mono);text-align:right">${fmt(Math.round(n))}</td>`; }

function summaryModel(){
  computeGroups();
  const byDisc={};
  groups.forEach(grp=>{
    const d=grp.discipline||'Other';
    if(!byDisc[d]) byDisc[d]={AC:0,EV:0,BAC:0};
    byDisc[d].AC+=grp.AC; byDisc[d].EV+=grp.EV; byDisc[d].BAC+=grp.BAC;
  });
  const order=['DRAINAGE ACTIVITIES','WATER SUPPLY ACTIVITIES','HVAC ACTIVITIES','ELECTRICAL ACTIVITIES','Functional Test','Snagging and de-snagging','Internal Rectification','PRECAST','Subcontractor Works Done by RA Labor'];
  Object.keys(byDisc).forEach(d=>{ if(!order.includes(d)) order.push(d); });
  const rows=order.filter(d=>byDisc[d]).map(d=>({label:DISC_LABEL[d]||d, ...evm(byDisc[d])}));
  const direct=rows.reduce((a,r)=>({AC:a.AC+r.AC,EV:a.EV+r.EV,BAC:a.BAC+r.BAC}),{AC:0,EV:0,BAC:0});
  // Unassigned overrun is still labour that was paid for — leaving it out of the project
  // total would understate spend and flatter CPI.
  const proj=evm({AC:direct.AC+indirectHrs+unassignedPool, EV:direct.EV, BAC:direct.BAC});
  return { rows, proj, indirect:indirectHrs };
}

function renderSummary(m){
  const M=summaryModel();
  document.getElementById('tb-info').textContent=periodTag(m)+' · '+(M.proj.cpi?M.proj.cpi.toFixed(2):'—')+' CPI';
  const head='<thead>'
    +'<tr><th class="l" rowspan="2">Direct Work</th><th colspan="3" style="text-align:center">'+(cumulative?'To Date':'This Month')+'</th><th colspan="4" style="text-align:center">Forecast to Complete</th></tr>'
    +'<tr><th>Actual Hrs (AC)</th><th>Allowable Budget (EV)</th><th>Current Variance</th><th>ETC</th><th>EAC</th><th>Var. in Budget</th><th>Var. AED @10.5</th></tr></thead>';
  const row=(r,cls)=>`<tr class="${cls||''}"><td class="l">${esc(r.label)}</td>${nCell(r.AC)}${nCell(r.EV)}${vCell(r.cv)}${nCell(r.etc)}${nCell(r.eac)}${vCell(r.bv)}${vCell(r.aed)}</tr>`;
  let b='<tbody>'+row({label:'PROJECT TOTAL',...M.proj},'totrow');
  M.rows.forEach(r=> b+=row(r));
  // indirect overhead (manpower only, no earned-value)
  b+=`<tr><td class="l">Total Indirect Works</td>${nCell(M.indirect)}<td colspan="6" class="muted" style="font-size:11px">overhead labour — not earned-rated</td></tr>`;
  // Held-back hours are real labour; showing them keeps the total reconcilable with payroll
  if(unassignedPool>0.5){
    b+=`<tr><td class="l" style="color:var(--warn,#f5c451)">Unassigned overrun</td>${nCell(unassignedPool)}`
      +`<td colspan="6" class="muted" style="font-size:11px">hours above what each category earned — `
      +`<a href="#" onclick="openAlloc();return false" style="color:var(--accent-text,#93b6ff)">assign to categories</a></td></tr>`;
  }
  b+=row({label:'PROJECT TOTAL',...M.proj},'totrow')+'</tbody>';
  document.getElementById('summary').innerHTML=
    `<div class="panel"><div class="panel-h" style="cursor:default">OBS Summary <span class="sub" style="font-weight:400;color:var(--text-muted)">— ${m} (${cumulative?'cumulative to date':'per month'}) · AED @ ${AED_RATE}/hr</span>`
    +`${canEnter?`<button class="btn" style="margin-left:auto" onclick="autoAssignAll()" title="Book every month's held-back hours against the group they came from, so nothing is left unassigned">⚖ Auto-assign all months</button>`
                +`<button class="btn" style="margin-left:8px" onclick="openAlloc()">⚖ Assign hours</button>`:''}</div>`
    +`<div style="overflow-x:auto"><table class="sumtbl">${head}${b}</table></div></div>`;
}

/* ───── MANUAL ASSIGNMENT OF CAPPED-OFF HOURS ─────
   Places the overrun the cap held back. Saved per month + activity group so the split
   is auditable and re-editable, rather than being folded into the trade percentages. */
function openAlloc(){
  if(!canEnter){ alert('You need OBS entry permission to assign hours.'); return; }
  // Same reason as openDone — the pool shown is cumulative, but a save targets one month.
  if(cumulative){ alert('Switch the period to “This month” to assign hours.\n\nThe cumulative pool spans several months; assignments are saved against a single month.'); return; }
  const m=document.getElementById('f-month').value||'';
  const heldBack=groups.reduce((s,g)=>s+(g.capped||0),0);
  const rows=groups.slice().sort((a,b)=>(b.capped||0)-(a.capped||0)).map(g=>{
    const cur=Number(manualAlloc[g.group])||0;
    return `<tr>
      <td class="l">${esc(g.group)}</td>
      <td style="text-align:right">${fmtK(g.ACraw||0)}</td>
      <td style="text-align:right">${fmtK(g.EV||0)}</td>
      <td style="text-align:right;color:${(g.capped||0)>0.5?'var(--warn,#f5c451)':'inherit'}">${fmtK(g.capped||0)}</td>
      <td style="text-align:right"><input type="number" step="1" min="0" value="${cur||''}" placeholder="0"
          data-grp="${esc(g.group)}" oninput="allocTotal()" class="alloc-in"
          style="width:90px;text-align:right;background:var(--bg-input,#0d1118);color:inherit;border:1px solid var(--border,#333);border-radius:6px;padding:3px 6px"></td>
    </tr>`;
  }).join('');
  const html=`<div id="alloc-ovl" style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:300"
       onclick="if(event.target===this)closeAlloc()">
    <div style="background:var(--bg-elev,#11151c);border:1px solid var(--border,#333);border-radius:12px;width:min(760px,94vw);max-height:86vh;display:flex;flex-direction:column">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border,#333)">
        <div style="font-size:14px;font-weight:650">Assign overrun hours — ${esc(m)}</div>
        <div style="font-size:11px;color:var(--text-muted,#8a93a3);margin-top:4px;line-height:1.5">
          Actual hours are capped at each category's <b>allowable budget (EV)</b>. The hours that
          exceeded it are listed under <b>Held back</b>; place them wherever the labour actually went.
          Anything left unassigned is still counted in the project total, so payroll always reconciles.
        </div>
      </div>
      <div style="padding:12px 18px;overflow:auto">
        <table class="sumtbl" style="width:100%">
          <thead><tr><th class="l">Activity group</th><th style="text-align:right">Distributed</th>
            <th style="text-align:right">Allowable (EV)</th><th style="text-align:right">Held back</th>
            <th style="text-align:right">Assign hrs</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="padding:10px 18px;border-top:1px solid var(--border,#333);display:flex;align-items:center;gap:10px">
        <span style="font-size:12px">Held back: <b>${fmtK(heldBack)}</b> hrs</span>
        <span style="font-size:12px">Assigned: <b id="alloc-sum">0</b></span>
        <span style="font-size:12px" id="alloc-left"></span>
        <span style="flex:1"></span>
        <button class="btn" onclick="closeAlloc()">Cancel</button>
        <button class="btn btn-primary" onclick="saveAlloc()">Save</button>
      </div>
    </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
  allocTotal();
}
/* ───── BACKFILL: give every month's held-back hours an explicit home ─────
   The cap holds back whatever the trade distribution pushed into a group beyond what that
   group earned. Until those hours are written down they sit in the project total as
   "Unassigned overrun" and can't be moved. This walks every month that has manpower and
   books each group's held-back hours against that same group — the neutral starting point,
   since that is where the distribution said the labour went — so every hour is attributed
   and editable afterwards via ⚖ Assign hours.

   Months that already carry manual assignments are left completely alone; overwriting
   someone's hand-placed split would be the one genuinely destructive thing here. */
async function autoAssignAll(){
  if(!canEnter){ alert('You need OBS entry permission to assign hours.'); return; }
  try{
    const [mpRows,allocRows]=await Promise.all([
      fa('obs_manpower?select=period_month'),
      fa('obs_hour_allocation?select=period_month,hours')
    ]);
    const months=[...new Set((mpRows||[]).map(r=>String(r.period_month).slice(0,7)))].sort();
    const taken={};
    (allocRows||[]).forEach(r=>{ const k=String(r.period_month).slice(0,7); taken[k]=(taken[k]||0)+(Number(r.hours)||0); });
    const todo=months.filter(m=>!(taken[m]>0));
    const skipped=months.filter(m=>taken[m]>0);
    if(!todo.length){ alert('Every month with manpower already has assigned hours.\n\nNothing to do.'); return; }
    if(!confirm('Assign held-back hours in '+todo.length+' month'+(todo.length>1?'s':'')+
      ' ('+todo[0]+' to '+todo[todo.length-1]+').\n\n'+
      'Each activity group gets its own held-back hours booked against it, so nothing is left '+
      'unassigned. You can then move them by hand with ⚖ Assign hours.'+
      (skipped.length?'\n\nSkipping '+skipped.length+' month'+(skipped.length>1?'s':'')+
        ' that already has assignments: '+skipped.join(', '):'')+'\n\nProceed?')) return;

    const loading=document.getElementById('loading'); loading.style.display='flex';
    const info=document.getElementById('tb-info');
    const by=(window.__MEP_USER__&&(window.__MEP_USER__.full_name||window.__MEP_USER__.email))||null;
    const wasCum=cumulative, wasMonth=document.getElementById('f-month').value;
    cumulative=false;                       // allocations are per-month by definition
    let written=0, hours=0, done=0;
    const failed=[];
    for(const m of todo){
      info.textContent='Assigning '+m+'  ('+(++done)+'/'+todo.length+')';
      try{
        await Promise.all([ loadCompletion(m,false), loadLabour(m,false), loadAlloc(m,false), loadManual(m,false) ]);
        computeGroups();
        const rows=groups.filter(g=>(g.capped||0)>0.5).map(g=>({
          period_month:m+'-01', activity_group:g.group, hours:Math.round(g.capped),
          updated_at:new Date().toISOString(), updated_by:by }));
        if(rows.length){
          await fwrite('POST','obs_hour_allocation',rows);
          written+=rows.length; hours+=rows.reduce((s,r)=>s+r.hours,0);
        }
      }catch(e){ failed.push(m+': '+e.message); }
    }
    cumulative=wasCum;
    document.getElementById('f-month').value=wasMonth;
    clearCompCache();
    loading.style.display='none';
    await reload();
    alert('Assigned '+fmt(hours,0)+' hrs across '+written+' group rows in '+(todo.length-failed.length)+' month(s).'+
      (skipped.length?'\n\nLeft untouched (already assigned): '+skipped.join(', '):'')+
      (failed.length?'\n\nFailed:\n'+failed.join('\n'):''));
  }catch(e){
    document.getElementById('loading').style.display='none';
    alert(/\[40[13]\]/.test(e.message) ? 'Assigning hours needs the manage_activities permission.'
                                       : 'Could not run the assignment: '+e.message);
  }
}

function closeAlloc(){ document.getElementById('alloc-ovl')?.remove(); }
function allocTotal(){
  const ins=[...document.querySelectorAll('.alloc-in')];
  const sum=ins.reduce((s,i)=>s+(Number(i.value)||0),0);
  const heldBack=groups.reduce((s,g)=>s+(g.capped||0),0);
  document.getElementById('alloc-sum').textContent=fmtK(sum);
  const left=heldBack-sum;
  const el=document.getElementById('alloc-left');
  el.textContent = left>=0 ? `· ${fmtK(left)} left unassigned`
                           : `· ${fmtK(-left)} over the held-back amount`;
  el.style.color = left<0 ? 'var(--bad,#ff8080)' : 'var(--text-muted,#8a93a3)';
}
async function saveAlloc(){
  const m=document.getElementById('f-month').value||''; if(!m) return;
  const period=m+'-01';
  const ins=[...document.querySelectorAll('.alloc-in')];
  const keep=[], drop=[];
  ins.forEach(i=>{
    const g=i.dataset.grp, v=Number(i.value)||0;
    (v>0?keep:drop).push({activity_group:g,hours:v});
  });
  try{
    // clear the month, then write only the non-zero rows — keeps the table free of noise
    await fwrite('DELETE','obs_hour_allocation?period_month=eq.'+period);
    if(keep.length) await fwrite('POST','obs_hour_allocation',
      keep.map(k=>({period_month:period,activity_group:k.activity_group,hours:k.hours,
                    updated_at:new Date().toISOString(),
                    updated_by:(window.__MEP_USER__?.full_name||window.__MEP_USER__?.email||null)})));
    closeAlloc();
    await loadAlloc(m);
    render(m); renderSummary(m);
  }catch(e){ alert('Could not save the assignment: '+e.message); }
}

function printSummary(){
  const M=summaryModel(); const m=document.getElementById('f-month').value||'';
  const fmtN=n=>{const v=Math.round(n);return v<0?'('+Math.abs(v).toLocaleString()+')':v.toLocaleString();};
  const r=x=>`<tr><td class="l">${x.label}</td><td>${fmtN(x.AC)}</td><td>${fmtN(x.EV)}</td><td class="${x.cv<0?'neg':'pos'}">${fmtN(x.cv)}</td><td>${fmtN(x.etc)}</td><td>${fmtN(x.eac)}</td><td class="${x.bv<0?'neg':'pos'}">${fmtN(x.bv)}</td><td class="${x.bv<0?'neg':'pos'}">${fmtN(x.aed)}</td></tr>`;
  let body=`<tr class="tot"><td class="l">PROJECT TOTAL</td><td>${fmtN(M.proj.AC)}</td><td>${fmtN(M.proj.EV)}</td><td class="${M.proj.cv<0?'neg':'pos'}">${fmtN(M.proj.cv)}</td><td>${fmtN(M.proj.etc)}</td><td>${fmtN(M.proj.eac)}</td><td class="${M.proj.bv<0?'neg':'pos'}">${fmtN(M.proj.bv)}</td><td class="${M.proj.bv<0?'neg':'pos'}">${fmtN(M.proj.aed)}</td></tr>`;
  M.rows.forEach(x=> body+=r(x));
  body+=`<tr><td class="l">Total Indirect Works</td><td>${fmtN(M.indirect)}</td><td colspan="6"></td></tr>`;
  const w=window.open('','_blank');
  w.document.write(`<html><head><title>OBS Summary ${m}${cumulative?' (cumulative)':''}</title><style>
    body{font-family:Arial,sans-serif;margin:24px;color:#111}
    h2{margin:0 0 2px} .sub{color:#666;font-size:12px;margin-bottom:14px}
    table{border-collapse:collapse;width:100%;font-size:12px}
    th,td{border:1px solid #999;padding:6px 8px;text-align:right}
    th{background:#f3dede} td.l,th.l{text-align:left}
    tr.tot td{background:#eef3e0;font-weight:bold} .neg{color:#c0392b} .pos{color:#1e8449}
  </style></head><body>
    <h2>Royal Advance — OBS Summary</h2><div class="sub">Balghaiylam Villa Project · ${cumulative?'Cumulative to end of '+m:'Month '+m} · AED @ ${AED_RATE}/hr</div>
    <table><thead><tr><th class="l">Direct Work</th><th>Actual Hrs</th><th>Allowable Budget</th><th>Current Variance</th><th>ETC</th><th>EAC</th><th>Var. in Budget</th><th>Var. AED</th></tr></thead><tbody>${body}</tbody></table>
  </body></html>`);
  w.document.close(); w.focus(); setTimeout(()=>w.print(),300);
}

// ── Session bridge ──
var _initCalled=false;
function _tryInit(){ if(_initCalled)return; if(window.self!==window.top && !window.__MEP_USER__)return; _initCalled=true; init(); }
window.addEventListener('message',function(e){
  if(!e.data||typeof e.data!=='object')return;
  if(e.data.type==='theme')applyTheme(e.data.theme);
  if(e.data.type==='session'){ window.__MEP_TOKEN__=e.data.token; window.__MEP_USER__=e.data.user; _tryInit(); }
});
window.addEventListener('storage',function(e){ if(e.key==='mep_theme')applyTheme(e.newValue); });
try{ const t=localStorage.getItem('mep_theme'); if(t)applyTheme(t); }catch(e){}
if(window.self!==window.top){
  document.body.classList.add('in-shell');
  try{ window.parent.postMessage({type:'child_ready'},'*'); }catch(e){}
  var _st=0;
  var _poll=setInterval(function(){
    if(_initCalled||window.__MEP_USER__){clearInterval(_poll);return;}
    if(++_st>=24){clearInterval(_poll);_initCalled=true;init();return;}
    try{ window.parent.postMessage({type:'child_ready'},'*'); }catch(e){}
  },500);
}else{ _tryInit(); }
</script>
