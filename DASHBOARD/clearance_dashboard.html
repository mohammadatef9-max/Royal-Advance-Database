<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script src="shared.js?v=3"></script>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Clearance Dashboard</title>
<style>
:root {
  --bg:#0b0e14;--bg-elev:#11151c;--bg-panel:#151a23;--bg-cell:#0f1319;
  --bg-row-alt:#111620;--bg-input:#0d1118;--bg-hover:#1c2333;
  --border:#1e2531;--border-strong:#2f3a4a;--border-subtle:#181d26;
  --text:#e6e9ef;--text-muted:#8a93a3;--text-dim:#5b6373;--text-faint:#454c5b;
  --accent:#4f8cff;--accent-soft:rgba(79,140,255,0.14);--accent-text:#93b6ff;
  --approved:#6ee2a3;--approved-bg:rgba(34,197,94,.10);
  --pending:#f5c451;--pending-bg:rgba(245,196,81,.09);
  --rejected:#ff8080;
  /* alternating cluster bands — barely-there tints that survive zebra striping */
  --band-a:#0f1319;--band-a-alt:#111620;
  --band-b:#121722;--band-b-alt:#141a26;
  --radius:10px;--mono:'JetBrains Mono',monospace;
}
html[data-theme="light"] {
  --bg:#f6f7fa;--bg-elev:#ffffff;--bg-panel:#f1f3f8;--bg-cell:#ffffff;
  --bg-row-alt:#fafbfd;--bg-input:#ffffff;--bg-hover:#e9eef7;
  --border:#dfe4ed;--border-strong:#c3cbd9;--border-subtle:#eceff5;
  --text:#141922;--text-muted:#5d6879;--text-dim:#8792a4;--text-faint:#aab2c0;
  --accent:#2563eb;--accent-soft:rgba(37,99,235,0.09);--accent-text:#1d4ed8;
  --approved:#0f7b46;--approved-bg:rgba(16,185,129,.10);
  --pending:#8a6100;--pending-bg:rgba(245,196,81,.16);
  --rejected:#b91c1c;
  --band-a:#ffffff;--band-a-alt:#fafbfd;
  --band-b:#f5f7fb;--band-b-alt:#f1f4f9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13px;
     -webkit-font-smoothing:antialiased}
/* ── header ── */
.hdr{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--bg-elev);
     border-bottom:1px solid var(--border);flex-wrap:wrap}
.hdr h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.hdr .today{font-size:12px;font-weight:500;color:var(--text-muted);padding-left:12px;border-left:1px solid var(--border)}
.spacer{flex:1}
.btn{padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:var(--bg-panel);color:var(--text);
     font:inherit;font-weight:550;font-size:12px;cursor:pointer;transition:background .12s,border-color .12s;line-height:1.4}
.btn:hover:not(:disabled){background:var(--bg-hover);border-color:var(--border-strong)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{padding:6px 10px;font-size:11px}
/* ── control bar, grouped into segments ── */
.ctrls{display:flex;align-items:center;gap:10px;padding:9px 22px;background:var(--bg-panel);
       border-bottom:1px solid var(--border);flex-wrap:wrap}
.seg{display:flex;align-items:center;gap:7px;padding-right:12px;margin-right:2px;border-right:1px solid var(--border)}
.seg:last-of-type{border-right:none}
.ctrl-label{font-size:10px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.chip{font-size:11px;padding:3px 10px;border-radius:6px;cursor:pointer;border:1px solid var(--border);
      background:var(--bg-cell);color:var(--text-muted);user-select:none;font-weight:550;transition:.12s}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
select{background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:7px;
       padding:5px 8px;font:inherit;font-size:12px}
#week-label{font-variant-numeric:tabular-nums}
/* ── table ── */
/* No top padding: `top:0` sticks to the scrollport's padding box, so any padding here
   leaves a strip above the pinned header that scrolled rows show through. The gap is
   put back as a margin on the table, which scrolls away instead. */
.wrap{overflow:auto;max-height:calc(100vh - 106px);padding:0 22px 22px}
#host table{margin-top:14px}
table{border-collapse:separate;border-spacing:0;font-size:11px;white-space:nowrap;
      font-variant-numeric:tabular-nums;border:1px solid var(--border);border-radius:10px}
th,td{border-right:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);
      padding:5px 7px;text-align:center}
/* Header rows stick at offsets measured after render (--h2/--h3) — hardcoding them
   broke the moment a header label wrapped to two lines and rows 2/3 drifted over
   the body. Stacking order, bottom to top: body < sticky body cols < tfoot < thead. */
thead th{position:sticky;background:var(--bg-panel);z-index:6;font-weight:600;font-size:10px;line-height:1.3;
         color:var(--text-muted);letter-spacing:.02em}
thead tr:nth-child(1) th{top:0}
thead tr:nth-child(2) th{top:var(--h2,28px)}
thead tr:nth-child(3) th{top:var(--h3,56px)}
thead tr:last-child th{border-bottom:1px solid var(--border-strong)}
tbody td{background:var(--bg-cell)}
tbody tr:nth-child(even) td{background:var(--bg-row-alt)}
tbody tr:hover td{background:var(--bg-hover)}
/* sticky identity columns, with a shadow that hints at scrolled content */
.sticky1,.sticky2,.sticky3{position:sticky;z-index:3;background:var(--bg-panel)!important}
.sticky1{left:0;width:32px;color:var(--text-dim);font-size:10px}
.sticky2{left:32px;text-align:left;min-width:236px;max-width:236px;white-space:normal;font-weight:550;color:var(--text)}
.sticky3{left:268px;width:112px;min-width:112px;font-family:var(--mono);font-size:10px;color:var(--text-muted);
         box-shadow:6px 0 8px -6px rgba(0,0,0,.45)}
thead .sticky1,thead .sticky2,thead .sticky3{z-index:7}
thead .sticky2,thead .sticky3{white-space:normal;font-family:'Inter',sans-serif}
thead th.c-app,thead th.c-pend{min-width:66px}
thead th{white-space:normal}
/* cluster bands — alternating tint so groups separate without heavy rules */
.grp{border-left:1px solid var(--border-strong);font-size:11px;font-weight:700;letter-spacing:.08em;
     color:var(--text);padding:5px 0}
.gA{background:var(--band-a)}
.gB{background:var(--band-b)}
tbody td.gA{background:var(--band-a)}
tbody td.gB{background:var(--band-b)}
tbody tr:nth-child(even) td.gA{background:var(--band-a-alt)}
tbody tr:nth-child(even) td.gB{background:var(--band-b-alt)}
tbody tr:hover td{background:var(--bg-hover)!important}
td.gstart,th.gstart{border-left:1px solid var(--border-strong)}
.c-app{font-weight:650;color:var(--accent-text)}
.c-pend{font-weight:650;color:var(--pending)}
.c-day{color:var(--text-muted);font-weight:450}
.c-day.hit{color:var(--text);font-weight:650}
/* dim the zeros with colour, not opacity — opacity would fade the cell's background
   too and give every zero cell its own stacking context */
.c-zero{color:var(--text-faint,var(--text-dim));font-weight:400}
.c-wk{font-weight:650;color:var(--text);background:rgba(127,127,127,.07);border-left:1px dashed var(--border-strong)}
.t-week{color:var(--text);font-weight:700;background:rgba(127,127,127,.10);border-left:1px solid var(--border-strong)}
.t-pend{color:var(--pending);font-weight:700;border-left:1px solid var(--border-strong);background:var(--pending-bg)}
.t-tot{color:var(--approved);font-weight:700;background:var(--approved-bg)}
/* A pinned cell must be FULLY opaque — the tint colours above are rgba, so rows
   scrolling underneath showed straight through the header/footer in exactly those
   columns (WEEK, Released This Week, Total Pending, Total Released). Repaint the tint
   as a gradient layer over an opaque base. The compound selectors matter: a bare
   `thead th` (0,0,2) loses to `.t-pend` (0,1,0), so each one is restated here. */
thead th.c-wk,   tfoot td.c-wk  {background-color:var(--bg-panel);
  background-image:linear-gradient(rgba(127,127,127,.07),rgba(127,127,127,.07))}
thead th.t-week, tfoot td.t-week{background-color:var(--bg-panel);
  background-image:linear-gradient(rgba(127,127,127,.10),rgba(127,127,127,.10))}
thead th.t-pend, tfoot td.t-pend{background-color:var(--bg-panel);
  background-image:linear-gradient(var(--pending-bg),var(--pending-bg))}
thead th.t-tot,  tfoot td.t-tot {background-color:var(--bg-panel);
  background-image:linear-gradient(var(--approved-bg),var(--approved-bg))}
tfoot td{position:sticky;bottom:0;background:var(--bg-panel);font-weight:700;z-index:4;
         border-top:1px solid var(--border-strong);color:var(--text)}
tfoot td.sticky1,tfoot td.sticky2,tfoot td.sticky3{z-index:5}
.empty{padding:48px;text-align:center;color:var(--text-muted);font-size:13px}
/* clickable count cells */
td.drill{cursor:pointer}
td.drill:hover{outline:1px solid var(--accent);outline-offset:-1px}
/* ── villa drill-down modal ── */
#ovl,.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200}
#ovl.on,.ovl.on{display:flex}
.fin{width:100%;background:var(--bg-input);color:var(--text);border:1px solid var(--border);
     border-radius:7px;padding:6px 9px;font:inherit;font-size:12px}
.pk{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.pk:hover{background:var(--bg-hover)}
.pk code{font-family:var(--mono);font-size:10px;color:var(--accent-text);min-width:86px}
.pk .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* layout editor rows */
.lr{display:flex;align-items:center;gap:9px;padding:6px 8px;border:1px solid var(--border);border-radius:7px;
    margin-bottom:5px;background:var(--bg-panel);font-size:12px;cursor:grab}
.lr.dragging{opacity:.4}
.lr .grip{color:var(--text-dim);cursor:grab;user-select:none}
.lr code{font-family:var(--mono);font-size:10px;color:var(--accent-text);min-width:86px}
.lr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr.off{opacity:.45}
.modal{background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:12px;
       width:min(620px,92vw);max-height:82vh;display:flex;flex-direction:column;box-shadow:0 18px 48px rgba(0,0,0,.5)}
.modal h3{margin:0;font-size:14px;font-weight:650}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.modal .msub{font-size:11px;color:var(--text-muted);margin-top:3px;line-height:1.5}
.modal .mb{padding:14px 18px;overflow:auto}
.modal .mf{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.vgrid{display:flex;flex-wrap:wrap;gap:5px}
.vchip{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:6px;
       background:var(--accent-soft);color:var(--accent-text);border:1px solid var(--border)}
.vchip small{color:var(--text-dim);margin-left:5px;font-family:'Inter',sans-serif}
.x{margin-left:auto;background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;line-height:1;padding:0 2px}
.x:hover{color:var(--text)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg-elev);border:1px solid var(--border);padding:9px 16px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.show{opacity:1}
#toast.error{border-color:var(--rejected);color:var(--rejected)}
/* ── PRINT: one A3 landscape sheet ─────────────────────────────────────────────
   The screen view is a dark, frozen-pane, scrolling grid — none of which survives
   on paper. Print gets a light palette, unpinned cells, a fixed layout scaled to the
   page width, and a title block naming the week and the filters that produced it. */
#print-head{display:none}
@media print{
  @page{size:A3 landscape;margin:7mm}

  /* Repoint the design tokens at a light palette. Chasing individual selectors doesn't
     work — rules like `.sticky2{background:var(--bg-panel)!important}` carry class
     specificity and beat any `th,td{...!important}` override, which is why the frozen
     columns printed as solid black bars. Redefining the variables fixes every consumer
     at once, including ones added later. */
  :root,html,html[data-theme="dark"],html[data-theme="light"]{
    --bg:#fff;--bg-elev:#fff;--bg-panel:#eceff4;--bg-cell:#fff;--bg-row-alt:#fff;
    --bg-input:#fff;--bg-hover:#fff;
    --border:#b5b5b5;--border-strong:#8a8a8a;--border-subtle:#c9c9c9;
    --text:#111;--text-muted:#444;--text-dim:#666;--text-faint:#b0b0b0;
    --accent:#0b3d91;--accent-soft:#e8f0fe;--accent-text:#0b3d91;
    --approved:#0b5c36;--approved-bg:#d9f2e4;
    --pending:#7a5300;--pending-bg:#fdf3d0;
    --rejected:#8a1c1c;
    --band-a:#fff;--band-a-alt:#fff;--band-b:#fff;--band-b-alt:#fff;
  }
  html,body{background:#fff!important;color:#111!important;font-size:7pt}
  /* colour carries meaning here (approved / pending), so keep it on paper */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}

  /* screen chrome off, print header on */
  .hdr,.ctrls,#ovl,.ovl,#toast{display:none!important}
  #print-head{display:block!important;margin-bottom:4mm}
  #print-head h2{margin:0 0 1mm;font-size:12pt;font-weight:700;color:#111}
  #print-head .meta{font-size:7.5pt;color:#444;line-height:1.5}

  /* unpin every sticky cell and let the table flow */
  .wrap{overflow:visible!important;max-height:none!important;padding:0!important}
  #host table{margin-top:0!important}
  thead th,tfoot td,.sticky1,.sticky2,.sticky3{position:static!important;box-shadow:none!important}

  /* repeat the header on every sheet; never split a row across pages */
  thead{display:table-header-group}
  tfoot{display:table-footer-group}
  tr,thead{break-inside:avoid;page-break-inside:avoid}

  /* fixed layout = the grid scales to the sheet instead of overflowing it */
  table{width:100%!important;table-layout:fixed;font-size:6.4pt;border:.5pt solid #888!important;
        border-radius:0!important}
  th,td{border:.4pt solid #b5b5b5!important;padding:1pt 1.5pt!important;color:#111!important;
        background:#fff!important;overflow:hidden;text-overflow:ellipsis}
  thead th{background:#eceff4!important;color:#111!important;font-size:6pt;font-weight:700}
  .grp{background:#dde3ec!important;color:#111!important;font-size:7pt}

  /* identity columns: give the title room, squeeze the rest */
  .sticky1{width:7mm}
  .sticky2{width:42mm;white-space:normal!important;font-weight:600}
  .sticky3{width:20mm;font-family:inherit!important}
  /* body identity cells read better white; the header keeps the panel tint */
  tbody .sticky1,tbody .sticky2,tbody .sticky3{background:#fff!important;color:#111!important}
  thead .sticky1,thead .sticky2,thead .sticky3{background:#eceff4!important;color:#111!important}

  /* light, printer-friendly versions of the on-screen tints */
  .c-app,thead th.c-app{background:#e8f0fe!important;color:#0b3d91!important;font-weight:700}
  .c-pend,thead th.c-pend{background:#fdf3d0!important;color:#7a5300!important;font-weight:700}
  .c-wk,thead th.c-wk,tfoot td.c-wk{background:#f0f0f0!important;color:#111!important;font-weight:700}
  .t-week,thead th.t-week,tfoot td.t-week{background:#e9e9e9!important;color:#111!important;font-weight:700}
  .t-pend,thead th.t-pend,tfoot td.t-pend{background:#fdf3d0!important;color:#7a5300!important;font-weight:700}
  .t-tot,thead th.t-tot,tfoot td.t-tot{background:#d9f2e4!important;color:#0b5c36!important;font-weight:700}
  tfoot td{background:#eceff4!important;font-weight:700}
  /* zeros stay faint so real numbers carry the page */
  .c-zero{color:#b0b0b0!important}
  .gA,.gB,tbody tr:nth-child(even) td{background:#fff!important}
  tbody tr:nth-child(even) td.c-app{background:#e8f0fe!important}
  tbody tr:nth-child(even) td.c-pend{background:#fdf3d0!important}
}
</style>
</head>
<body>

<div class="hdr">
  <h1>Clearance Dashboard</h1>
  <span class="today" id="today">—</span>
  <span class="spacer"></span>
  <button class="btn" onclick="load()">↻ Refresh</button>
  <button class="btn primary" onclick="window.print()">🖨 Print</button>
  <button class="btn" onclick="exportCsv()">⬇ CSV</button>
</div>

<div class="ctrls">
  <div class="seg">
    <span class="ctrl-label">Week</span>
    <button class="btn icon" onclick="shiftWeek(-1)" title="Previous week">◀</button>
    <span id="week-label" style="font-size:12px;font-weight:600;min-width:186px;text-align:center">—</span>
    <button class="btn icon" id="btn-next" onclick="shiftWeek(1)" title="Next week">▶</button>
    <button class="btn" onclick="thisWeek()">This week</button>
  </div>
  <div class="seg">
    <span class="ctrl-label">Clusters</span>
    <span id="cl-chips" style="display:flex;gap:4px;flex-wrap:wrap"></span>
  </div>
  <div class="seg">
    <span class="ctrl-label">Clearance</span>
    <button class="btn" id="btn-pick" onclick="openPicker()">All clearances ▾</button>
  </div>
  <div class="seg">
    <span class="ctrl-label">Discipline</span>
    <select id="f-disc" onchange="render()">
      <option value="">All</option>
      <option value="mechanical">Mechanical</option>
      <option value="electrical">Electrical</option>
      <option value="civil">Civil</option>
    </select>
    <label class="chip on" id="chip-hide" onclick="toggleHide()">Hide empty rows</label>
    <button class="btn" id="btn-layout" onclick="openLayout()" style="display:none">⚙ Rows</button>
  </div>
  <span class="spacer"></span>
  <span id="status" style="font-size:11px;color:var(--text-dim);text-align:right;max-width:520px"></span>
</div>

<div class="wrap">
  <!-- print-only: the sheet must say what it is without the on-screen controls -->
  <div id="print-head"><h2>Clearance Dashboard</h2><div class="meta" id="print-meta"></div></div>
  <div id="host"><div class="empty"><span class="spin"></span> Loading…</div></div>
</div>

<div id="ovl" onclick="if(event.target===this)closeDrill()">
  <div class="modal">
    <div class="mh">
      <div style="flex:1">
        <h3 id="dr-title">—</h3>
        <div class="msub" id="dr-sub"></div>
      </div>
      <button class="x" onclick="closeDrill()" title="Close">×</button>
    </div>
    <div class="mb" id="dr-body"></div>
    <div class="mf">
      <button class="btn" onclick="copyVillas()">Copy villa numbers</button>
      <span id="dr-msg" style="font-size:11px;color:var(--text-muted)"></span>
      <span class="spacer"></span>
      <button class="btn" onclick="closeDrill()">Close</button>
    </div>
  </div>
</div>

<!-- clearance multi-select -->
<div id="pick-ovl" class="ovl" onclick="if(event.target===this)closePicker()">
  <div class="modal">
    <div class="mh">
      <div style="flex:1">
        <h3>Filter clearances</h3>
        <div class="msub">Tick the clearance titles to show. None ticked = show all.</div>
      </div>
      <button class="x" onclick="closePicker()" title="Close">×</button>
    </div>
    <div style="padding:10px 18px 0"><input class="fin" id="pick-search" placeholder="Search title or code…" oninput="renderPicker()"></div>
    <div class="mb" id="pick-body"></div>
    <div class="mf">
      <button class="btn" onclick="pickAll(true)">Select all</button>
      <button class="btn" onclick="pickAll(false)">Clear</button>
      <span id="pick-count" style="font-size:11px;color:var(--text-muted)"></span>
      <span class="spacer"></span>
      <button class="btn primary" onclick="applyPicker()">Apply</button>
    </div>
  </div>
</div>

<!-- super-admin row layout -->
<div id="lay-ovl" class="ovl" onclick="if(event.target===this)closeLayout()">
  <div class="modal">
    <div class="mh">
      <div style="flex:1">
        <h3>Configure rows</h3>
        <div class="msub">Drag to reorder, untick to hide. Saved as the default for <b>everyone</b> in this workspace.</div>
      </div>
      <button class="x" onclick="closeLayout()" title="Close">×</button>
    </div>
    <div class="mb" id="lay-body"></div>
    <div class="mf">
      <button class="btn" onclick="layReset()">Reset to A–Z</button>
      <span id="lay-msg" style="font-size:11px;color:var(--text-muted)"></span>
      <span class="spacer"></span>
      <button class="btn" onclick="closeLayout()">Cancel</button>
      <button class="btn primary" onclick="saveLayout()">Save for everyone</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// SB and KEY are provided by shared.js
function getH(extra){
  let token = window.__MEP_TOKEN__;
  if(!token){
    try{
      const s=localStorage.getItem('mep_session');
      if(s){const j=JSON.parse(s); if(j&&j.access_token&&j.expires_at&&Date.now()<j.expires_at-30000) token=j.access_token;}
    }catch(e){}
  }
  return Object.assign({'apikey':KEY,'Authorization':'Bearer '+(token||KEY),'Content-Type':'application/json'}, extra||{});
}
function toast(m,t){const el=document.getElementById('toast');el.textContent=m;el.className='show '+(t||'');clearTimeout(el._t);el._t=setTimeout(()=>el.className='',3200);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// CCLR-* codes are civil clearances. Their `discipline` column is unreliable — 5 of the
// 7 are stored as "mechanical" and 2 as "electrical" — so the code prefix is what
// decides, not the discipline. MEP hides them; Civil shows only them.
const isCivilClearance = code => /^CCLR/i.test(String(code||'').trim());
function activeWorkspace(){
  try{ return sessionStorage.getItem('kp_ws')||''; }catch(e){ return ''; }
}
function inWorkspace(r){
  const ws=activeWorkspace();
  if(ws==='mep')   return !isCivilClearance(r.clearance_code);
  if(ws==='civil') return  isCivilClearance(r.clearance_code);
  return true;   // standalone / no workspace picked → everything
}

let rows=[];              // raw rpc rows
let clusters=[];          // cluster codes present in the data
let shown=new Set();      // clusters currently displayed
let dates=[];             // date strings for the day columns (Fri → Thu)
let hideEmpty=true;
let weekStart=null;       // Date of the displayed week's Friday

// The project runs on Dubai time (UTC+4, no DST) and the week rolls over at Dubai
// midnight. Using the browser's own clock meant a device in another timezone could sit
// in a different week than the database — which showed up as a whole week of zeros.
function dubaiNow(){
  const d = new Date(Date.now() + 4*3600*1000);
  return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}
// Site week runs Friday → Thursday.
function fridayOf(d){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  x.setDate(x.getDate() - ((x.getDay() - 5 + 7) % 7));   // 5 = Friday
  return x;
}
const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);

function todayLabel(){
  return dubaiNow().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

// Seven columns, Friday through Thursday of the selected week.
function buildDates(){
  const out=[];
  for(let i=0;i<7;i++){ const d=new Date(weekStart); d.setDate(d.getDate()+i); out.push(iso(d)); }
  return out;
}
function dLabel(isoStr){
  const d=new Date(isoStr+'T00:00:00');
  return {wd:d.toLocaleDateString('en-GB',{weekday:'short'}), dm:d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'})};
}
function shiftWeek(n){ weekStart.setDate(weekStart.getDate()+n*7); load(); }
function thisWeek(){ weekStart=fridayOf(dubaiNow()); load(); }

function paintWeekLabel(){
  const end=new Date(weekStart); end.setDate(end.getDate()+6);
  const f=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
  const cur=iso(fridayOf(dubaiNow()));
  const isCurrent = iso(weekStart)===cur;
  document.getElementById('week-label').innerHTML =
    `Fri ${f(weekStart)} – Thu ${f(end)}` +
    (isCurrent ? ' <span style="color:var(--accent-text)">(this week)</span>' : '');
  // never page into the future
  document.getElementById('btn-next').disabled = isCurrent;
}

async function load(){
  const host=document.getElementById('host');
  host.innerHTML='<div class="empty"><span class="spin"></span> Loading…</div>';
  if(!weekStart) weekStart=fridayOf(dubaiNow());
  dates=buildDates();
  paintWeekLabel();
  try{
    const r=await fetch(`${SB}/rest/v1/rpc/clearance_dashboard_stats`,
      {method:'POST',headers:getH(),body:JSON.stringify({p_from:dates[0],p_to:dates[6]})});
    if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,140));
    rows=(await r.json()).filter(inWorkspace);
    clusters=[...new Set(rows.map(x=>x.cluster_code).filter(Boolean))].sort();
    if(!shown.size) clusters.forEach(c=>shown.add(c));
    else [...shown].forEach(c=>{ if(!clusters.includes(c)) shown.delete(c); });
    await loadLayout();
    await loadDataThrough();
    paintPickBtn();
    buildChips();
    render();
  }catch(e){
    host.innerHTML=`<div class="empty">Could not load: ${esc(e.message)}</div>`;
    toast('Load failed: '+e.message,'error');
  }
}

function buildChips(){
  document.getElementById('cl-chips').innerHTML=clusters.map(c=>
    `<label class="chip ${shown.has(c)?'on':''}" onclick="toggleCluster('${c}')">${c}</label>`).join('');
}
function toggleCluster(c){ shown.has(c)?shown.delete(c):shown.add(c); buildChips(); render(); }
function toggleHide(){ hideEmpty=!hideEmpty; document.getElementById('chip-hide').classList.toggle('on',hideEmpty); render(); }

function render(){
  const host=document.getElementById('host');
  const disc=document.getElementById('f-disc').value;
  const cls=clusters.filter(c=>shown.has(c));
  if(!cls.length){ host.innerHTML='<div class="empty">Pick at least one cluster.</div>'; return; }

  // clearance_code -> {name, discipline, byCluster:{code:row}}
  const byCode={};
  rows.forEach(r=>{
    if(disc && (r.discipline||'')!==disc) return;
    if(!shown.has(r.cluster_code)) return;
    const k=r.clearance_code;
    if(!byCode[k]) byCode[k]={name:r.clearance_name,discipline:r.discipline,cl:{}};
    byCode[k].cl[r.cluster_code]=r;
  });

  // Row order/visibility: the shared super-admin layout wins, then A–Z for anything
  // it doesn't mention (a newly imported clearance code shouldn't silently vanish).
  let codes=Object.keys(byCode);
  if(layout.length){
    const pos={}, hid={};
    layout.forEach((l,i)=>{ pos[l.code]=i; if(l.hidden) hid[l.code]=1; });
    codes=codes.filter(k=>!hid[k])
               .sort((a,b)=>(pos[a]??9e6)-(pos[b]??9e6) || a.localeCompare(b));
  } else codes.sort();
  if(pickSel.size) codes=codes.filter(k=>pickSel.has(k));
  if(hideEmpty) codes=codes.filter(k=>cls.some(c=>{
    const x=byCode[k].cl[c]; return x && (+x.fully_approved || +x.pending);
  }));
  if(!codes.length){ host.innerHTML='<div class="empty">Nothing to show for this filter.</div>'; return; }

  const dl=dates.map(dLabel);
  const perCluster=3+dates.length;      // approved + pending + day columns + week subtotal

  // ── header: cluster groups / column names / dates ──
  const band = i => i%2 ? 'gB' : 'gA';

  let h1=`<tr><th class="sticky1" rowspan="3">#</th><th class="sticky2" rowspan="3">Title of Clearance</th>`+
         `<th class="sticky3" rowspan="3">Clearance Code</th>`;
  cls.forEach((c,i)=>{ h1+=`<th class="grp gstart ${band(i)}" colspan="${perCluster}">${c}</th>`; });
  h1+=`<th class="t-week" rowspan="3">Released<br>This Week</th>`+
      `<th class="t-pend" rowspan="3">Total<br>Pending</th><th class="t-tot" rowspan="3">Total<br>Released</th></tr>`;

  let h2='<tr>';
  cls.forEach((c,i)=>{
    const b=band(i);
    h2+=`<th class="c-app gstart ${b}">FULLY<br>APPROVED</th><th class="c-pend ${b}">PENDING</th>`;
    dl.forEach(d=>{ h2+=`<th class="${b}">${d.wd}</th>`; });
    h2+=`<th class="c-wk ${b}">WEEK</th>`;
  });
  h2+='</tr>';

  let h3='<tr>';
  cls.forEach((c,i)=>{
    const b=band(i);
    h3+=`<th class="gstart ${b}"></th><th class="${b}"></th>`;
    dl.forEach(d=>{ h3+=`<th class="${b}" style="font-weight:450;color:var(--text-dim)">${d.dm}</th>`; });
    h3+=`<th class="${b}"></th>`;
  });
  h3+='</tr>';

  // ── body ──
  const totals={app:0,pend:0,week:0,perCol:{},perWeek:{}};
  let body='';
  codes.forEach((code,i)=>{
    const rec=byCode[code];
    let rowPend=0,rowApp=0,rowWeek=0,tds='';
    cls.forEach((c,gi)=>{
      const b=band(gi);
      const x=rec.cl[c];
      const app=x?+x.fully_approved:0, pend=x?+x.pending:0, daily=(x&&x.daily)||{};
      rowApp+=app; rowPend+=pend;
      // any non-zero count opens the villa list behind it
      const dr=(n,kind,date)=> n
        ? ` drill" onclick="openDrill('${code.replace(/'/g,"\\'")}','${c}','${kind}',${date?`'${date}'`:'null'})"`
        : '"';
      tds+=`<td class="c-app gstart ${b} ${app?'':'c-zero'}${dr(app,'fully_approved',null)}>${app||0}</td>`;
      tds+=`<td class="c-pend ${b} ${pend?'':'c-zero'}${dr(pend,'pending',null)}>${pend||0}</td>`;
      let clWeek=0;
      dates.forEach(d=>{
        const n=+(daily[d]||0);
        clWeek+=n;
        const key=c+'|'+d; totals.perCol[key]=(totals.perCol[key]||0)+n;
        tds+=`<td class="c-day ${b} ${n?'hit':'c-zero'}${dr(n,'released',d)}>${n||0}</td>`;
      });
      rowWeek+=clWeek;
      totals.perWeek[c]=(totals.perWeek[c]||0)+clWeek;
      tds+=`<td class="c-wk ${b} ${clWeek?'':'c-zero'}">${clWeek||0}</td>`;
    });
    totals.app+=rowApp; totals.pend+=rowPend; totals.week+=rowWeek;
    body+=`<tr><td class="sticky1">${i+1}</td>`+
          `<td class="sticky2">${esc(rec.name||code)}</td>`+
          `<td class="sticky3">${esc(code)}</td>`+tds+
          `<td class="t-week ${rowWeek?'':'c-zero'}">${rowWeek||0}</td>`+
          `<td class="t-pend">${rowPend||0}</td><td class="t-tot">${rowApp||0}</td></tr>`;
  });

  // ── footer totals ──
  let foot=`<tr><td class="sticky1"></td><td class="sticky2">TOTAL</td><td class="sticky3"></td>`;
  cls.forEach((c,gi)=>{
    let a=0,p=0;
    codes.forEach(k=>{ const x=byCode[k].cl[c]; if(x){ a+=+x.fully_approved; p+=+x.pending; } });
    foot+=`<td class="c-app gstart">${a}</td><td class="c-pend">${p}</td>`;
    dates.forEach(d=>{ foot+=`<td>${totals.perCol[c+'|'+d]||0}</td>`; });
    foot+=`<td class="c-wk">${totals.perWeek[c]||0}</td>`;
  });
  foot+=`<td class="t-week">${totals.week}</td>`+
        `<td class="t-pend">${totals.pend}</td><td class="t-tot">${totals.app}</td></tr>`;

  // A week with no releases at all is almost always "not imported yet", not "nothing
  // happened" — spell that out rather than leaving a grid of zeros to interpret.
  let notice='';
  if(!totals.week){
    const fmtD=s=>new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    const behind = dataThrough && dataThrough < dates[0];
    notice=`<div style="margin-bottom:10px;padding:9px 12px;border:1px solid var(--border-strong);
      border-radius:8px;background:var(--pending-bg);color:var(--text);font-size:12px">
      <b>No clearances released in this week.</b> ${
        behind
          ? `The DC log currently only goes up to <b>${fmtD(dataThrough)}</b>, so this week has no data yet — import the latest log, or use ◀ to view an earlier week.`
          : dataThrough
            ? `Latest release in the imported log: <b>${fmtD(dataThrough)}</b>.`
            : ''}
    </div>`;
  }
  host.innerHTML=notice+`<table><thead>${h1}${h2}${h3}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`;
  syncHeaderOffsets();
  paintPrintHead(cls, codes.length, disc);
  const ws=activeWorkspace();
  document.getElementById('status').textContent=
    `${codes.length} clearance types · ${cls.length} clusters · ${totals.app.toLocaleString()} released, ${totals.pend.toLocaleString()} pending` +
    (ws==='mep' ? ' · civil (CCLR) hidden' : ws==='civil' ? ' · civil only' : '') +
    ' · figures as at ' + (function(){
      const end=dates[6], today=iso(dubaiNow());
      const a=(end&&end<today)?end:today;
      return new Date(a+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    })();
}

// Header rows 2 and 3 must stick directly beneath the rows above them. Their heights
// depend on how the labels wrap (and on zoom / font loading), so measure rather than
// assume — a wrong offset leaves a header row floating across the body as you scroll.
function syncHeaderOffsets(){
  const t=document.querySelector('#host table'); if(!t) return;
  const tr=t.querySelectorAll('thead tr'); if(tr.length<3) return;
  const h1=tr[0].getBoundingClientRect().height;
  const h2=tr[1].getBoundingClientRect().height;
  t.style.setProperty('--h2', Math.round(h1)+'px');
  t.style.setProperty('--h3', Math.round(h1+h2)+'px');
}
// re-measure when the layout can change under us
window.addEventListener('resize', syncHeaderOffsets);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(syncHeaderOffsets).catch(()=>{});

// The printed sheet loses every on-screen control, so restate what it shows: which
// week, which clusters, which filters, and the date the figures are stated as at.
function paintPrintHead(cls, rowCount, disc){
  const el=document.getElementById('print-meta'); if(!el) return;
  const f=s=>new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const end=dates[6], today=iso(dubaiNow());
  const asOf=(end&&end<today)?end:today;
  const ws=activeWorkspace();
  const bits=[
    `<b>Week:</b> Fri ${f(dates[0])} – Thu ${f(dates[6])}`,
    `<b>Clusters:</b> ${cls.join(', ')||'—'}`,
    `<b>Clearances:</b> ${pickSel.size? pickSel.size+' selected' : 'all'} (${rowCount} shown)`,
  ];
  if(disc) bits.push(`<b>Discipline:</b> ${esc(disc)}`);
  if(ws==='mep')   bits.push('civil (CCLR) excluded');
  if(ws==='civil') bits.push('civil only');
  el.innerHTML = bits.join(' &nbsp;·&nbsp; ') +
    `<br><b>Approved / Pending as at:</b> ${f(asOf)} &nbsp;·&nbsp; day columns are releases within the week` +
    `&nbsp;·&nbsp; printed ${new Date().toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}`;
}

// How far the imported DC log actually reaches. A week beyond this is empty because the
// data hasn't been imported yet — very different from "nothing was released", so say so.
let dataThrough=null;
async function loadDataThrough(){
  try{
    const r=await fetch(`${SB}/rest/v1/rpc/clearance_data_through`,{method:'POST',headers:getH(),body:'{}'});
    if(r.ok){ const d=await r.json(); dataThrough=(typeof d==='string')?d:(d&&d[0])||null; }
  }catch(e){ dataThrough=null; }
}

// ── clearance title filter (multi-select) ──
let pickSel=new Set();       // empty = show all
function allCodes(){
  const m={}; rows.forEach(r=>{ if(!m[r.clearance_code]) m[r.clearance_code]=r.clearance_name||r.clearance_code; });
  return Object.keys(m).sort().map(c=>({code:c,name:m[c]}));
}
function openPicker(){ document.getElementById('pick-ovl').classList.add('on'); renderPicker(); }
function closePicker(){ document.getElementById('pick-ovl').classList.remove('on'); }
function renderPicker(){
  const q=(document.getElementById('pick-search').value||'').toLowerCase().trim();
  const list=allCodes().filter(x=>!q||x.code.toLowerCase().includes(q)||x.name.toLowerCase().includes(q));
  document.getElementById('pick-body').innerHTML = list.length
    ? list.map(x=>`<label class="pk"><input type="checkbox" ${pickSel.has(x.code)?'checked':''}
        onchange="togglePick('${x.code.replace(/'/g,"\\'")}')"><code>${esc(x.code)}</code>
        <span class="nm">${esc(x.name)}</span></label>`).join('')
    : '<div style="color:var(--text-muted);font-size:12px">No clearances match.</div>';
  document.getElementById('pick-count').textContent =
    pickSel.size ? pickSel.size+' selected' : 'showing all';
}
function togglePick(c){ pickSel.has(c)?pickSel.delete(c):pickSel.add(c); renderPicker(); }
function pickAll(on){
  pickSel.clear();
  if(on) allCodes().forEach(x=>pickSel.add(x.code));
  renderPicker();
}
function applyPicker(){
  // "all ticked" means the same as no filter — keep the button honest
  if(pickSel.size===allCodes().length) pickSel.clear();
  closePicker(); paintPickBtn(); render();
}
function paintPickBtn(){
  document.getElementById('btn-pick').textContent =
    (pickSel.size ? pickSel.size+' clearance'+(pickSel.size>1?'s':'') : 'All clearances')+' ▾';
}

// ── shared row layout (super admin only) ──
let layout=[];            // [{code, hidden}] display order
let layDraft=[];
const layoutScope = () => activeWorkspace() || 'all';
function isSuperAdmin(){
  const u=window.__MEP_USER__||{};
  return u.main_role_id===1 || u.role_id===1 || (u.role||'')==='super_admin' ||
         (Array.isArray(u.permissions) && u.permissions.includes('manage_system') && u.permissions.includes('manage_users'));
}
async function loadLayout(){
  try{
    const r=await fetch(`${SB}/rest/v1/clearance_dashboard_layout?scope=eq.${encodeURIComponent(layoutScope())}&select=layout`,{headers:getH()});
    if(r.ok){ const d=await r.json(); layout=(d[0]&&Array.isArray(d[0].layout))?d[0].layout:[]; }
  }catch(e){ layout=[]; }
  document.getElementById('btn-layout').style.display = isSuperAdmin() ? '' : 'none';
}
function openLayout(){
  const known=allCodes();
  const pos={}; layout.forEach((l,i)=>pos[l.code]=i);
  layDraft=known.slice().sort((a,b)=>(pos[a.code]??9e6)-(pos[b.code]??9e6)||a.code.localeCompare(b.code))
    .map(x=>({code:x.code,name:x.name,hidden:!!(layout.find(l=>l.code===x.code)||{}).hidden}));
  document.getElementById('lay-msg').textContent='';
  document.getElementById('lay-ovl').classList.add('on');
  renderLayout();
}
function closeLayout(){ document.getElementById('lay-ovl').classList.remove('on'); }
function renderLayout(){
  document.getElementById('lay-body').innerHTML = layDraft.map((l,i)=>
    `<div class="lr ${l.hidden?'off':''}" draggable="true" data-i="${i}"
        ondragstart="layDragStart(event,${i})" ondragover="layDragOver(event,${i})" ondrop="layDrop(event,${i})"
        ondragend="this.classList.remove('dragging')">
      <span class="grip">⋮⋮</span>
      <input type="checkbox" ${l.hidden?'':'checked'} onclick="event.stopPropagation()" onchange="layToggle(${i})">
      <code>${esc(l.code)}</code><span class="nm">${esc(l.name)}</span>
      <span style="color:var(--text-dim);font-size:10px">${i+1}</span>
    </div>`).join('');
}
function layToggle(i){ layDraft[i].hidden=!layDraft[i].hidden; renderLayout(); }
let layFrom=null;
function layDragStart(e,i){ layFrom=i; e.currentTarget.classList.add('dragging'); try{e.dataTransfer.effectAllowed='move';}catch(_){} }
function layDragOver(e,i){ e.preventDefault(); }
function layDrop(e,i){
  e.preventDefault();
  if(layFrom===null||layFrom===i) return;
  const [m]=layDraft.splice(layFrom,1); layDraft.splice(i,0,m); layFrom=null; renderLayout();
}
function layReset(){ layDraft.sort((a,b)=>a.code.localeCompare(b.code)); renderLayout(); }
async function saveLayout(){
  const msg=document.getElementById('lay-msg');
  msg.style.color='var(--text-muted)'; msg.textContent='Saving…';
  const body={ scope:layoutScope(),
               layout:layDraft.map(l=>({code:l.code,hidden:!!l.hidden})),
               updated_at:new Date().toISOString(),
               updated_by:(window.__MEP_USER__?.full_name||window.__MEP_USER__?.email||null) };
  try{
    const r=await fetch(`${SB}/rest/v1/clearance_dashboard_layout?on_conflict=scope`,
      {method:'POST',headers:{...getH(),'Prefer':'resolution=merge-duplicates,return=representation'},
       body:JSON.stringify(body)});
    if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,160));
    layout=body.layout;
    msg.style.color='var(--approved)'; msg.textContent='✓ Saved as the default for everyone';
    render();
    setTimeout(closeLayout,700);
  }catch(e){
    msg.style.color='var(--rejected)';
    msg.textContent = /permission|denied|42501|401|403/i.test(e.message)
      ? 'Only a super admin can change the shared layout.'
      : 'Save failed: '+e.message;
  }
}

// ── villa drill-down ──
let drillVillas=[];
const KIND_LABEL={released:'Released',fully_approved:'Fully approved',pending:'Pending'};

async function openDrill(code,cluster,kind,date){
  const ovl=document.getElementById('ovl');
  const name=(rows.find(r=>r.clearance_code===code)||{}).clearance_name||code;
  const endIso = dates[6], todayIso = iso(dubaiNow());
  const asOf = (endIso && endIso < todayIso) ? endIso : todayIso;
  const when = kind==='released'
    ? new Date(date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})
    : 'as of '+new Date(asOf+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('dr-title').textContent=name;
  document.getElementById('dr-sub').innerHTML=
    `<b>${esc(code)}</b> · ${esc(cluster)} · ${KIND_LABEL[kind]||kind} — ${esc(when)}`;
  document.getElementById('dr-body').innerHTML='<div style="padding:14px;color:var(--text-muted)"><span class="spin"></span> Loading villas…</div>';
  document.getElementById('dr-msg').textContent='';
  drillVillas=[];
  ovl.classList.add('on');
  try{
    const r=await fetch(`${SB}/rest/v1/rpc/clearance_dashboard_villas`,{
      method:'POST',headers:getH(),
      // p_asof keeps the villa list on the same point in time as the cell that was clicked
      body:JSON.stringify({p_code:code,p_cluster:cluster,p_kind:kind,p_date:date||null,p_asof:dates[6]||null})});
    if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,140));
    const list=await r.json();
    drillVillas=list.map(v=>v.villa_no);
    document.getElementById('dr-body').innerHTML = list.length
      ? `<div style="font-size:11px;color:var(--text-muted);margin-bottom:9px">${list.length} villa${list.length!==1?'s':''}</div>`+
        `<div class="vgrid">`+list.map(v=>
          `<span class="vchip">${esc(v.villa_no)}${v.villa_type?`<small>${esc(v.villa_type)}</small>`:''}</span>`).join('')+`</div>`
      : '<div style="color:var(--text-muted)">No villas found for this cell.</div>';
  }catch(e){
    document.getElementById('dr-body').innerHTML=`<div style="color:var(--rejected)">Could not load: ${esc(e.message)}</div>`;
  }
}
function closeDrill(){ document.getElementById('ovl').classList.remove('on'); }
function copyVillas(){
  if(!drillVillas.length) return;
  const txt=drillVillas.join(', ');
  const done=()=>{document.getElementById('dr-msg').textContent='✓ Copied '+drillVillas.length+' villa numbers';};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>{});
  else { const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select();
         try{document.execCommand('copy');done();}catch(e){} t.remove(); }
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrill(); });

function exportCsv(){
  const cls=clusters.filter(c=>shown.has(c));
  const disc=document.getElementById('f-disc').value;
  const head=['#','Title of Clearance','Clearance Code'];
  cls.forEach(c=>{ head.push(c+' Fully Approved', c+' Pending'); dates.forEach(d=>head.push(c+' '+d)); head.push(c+' Week Total'); });
  head.push('Released This Week','Total Pending','Total Released');
  const byCode={};
  rows.forEach(r=>{
    if(disc && (r.discipline||'')!==disc) return;
    if(!shown.has(r.cluster_code)) return;
    (byCode[r.clearance_code]=byCode[r.clearance_code]||{name:r.clearance_name,cl:{}}).cl[r.cluster_code]=r;
  });
  const lines=[head.join(',')];
  // export exactly what's on screen: same rows, same order
  const shownCodes=[...document.querySelectorAll('tbody .sticky3')].map(td=>td.textContent.trim())
                     .filter(c=>byCode[c]);
  (shownCodes.length?shownCodes:Object.keys(byCode).sort()).forEach((code,i)=>{
    const rec=byCode[code]; let a=0,p=0,wk=0;
    const cells=[i+1,'"'+String(rec.name||'').replace(/"/g,'""')+'"',code];
    cls.forEach(c=>{
      const x=rec.cl[c], ap=x?+x.fully_approved:0, pe=x?+x.pending:0, daily=(x&&x.daily)||{};
      a+=ap; p+=pe; cells.push(ap,pe);
      let cw=0;
      dates.forEach(d=>{ const n=+(daily[d]||0); cw+=n; cells.push(n); });
      wk+=cw; cells.push(cw);
    });
    cells.push(wk,p,a);
    lines.push(cells.join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='clearance_dashboard_week_'+dates[0]+'.csv';
  a.click();
}

// ── shell session bridge (same contract as the other pages) ──
window.addEventListener('message',function(e){
  if(!e.data||typeof e.data!=='object')return;
  if(e.data.type==='theme') document.documentElement.setAttribute('data-theme',e.data.theme);
  if(e.data.type==='session'){
    window.__MEP_TOKEN__=e.data.token; window.__MEP_USER__=e.data.user;
    if(!rows.length) load();
  }
  // a fresh clearance import invalidates every number on this page
  if(e.data.type==='data_updated' && (e.data.dataType==='clearance'||e.data.dataType==='clr')) load();
});
try{window.parent.postMessage({type:'child_ready'},'*');}catch(e){}

document.getElementById('today').textContent=todayLabel();
load();
